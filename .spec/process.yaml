process:
  - id: observe
    purpose: Establish evidence before interpretation.
    inputs:
      - source code
      - tests
      - configuration and operator-tunable settings
      - documentation
      - interfaces and schemas
      - observed behavior
      - decision records
    outputs:
      - evidence register (spec/evidence.yaml), each entry with kind, source, and note
      - reference anchor (reference.yaml) pinning citations to a specific revision
    rules:
      - Record evidence as it is used, not retrospectively. The register is what the recovery actually consulted.
      - Every entry states its kind (code, test, doc, behavior, statement) so later basis claims can be checked against it.

  - id: reconstruct
    purpose: Reconstruct the whole subject behind the evidence.
    required_views:
      - concepts and relationships
      - responsibilities and ownership
      - decomposition into layers (how the subject comes apart, stated once in reading order)
      - end-to-end interactions
      - lifecycle and state
      - interfaces
      - invariants
      - failures and recovery
      - operator contract (which tunable parameters exist and what each governs)
      - optional capability boundaries (which capabilities are extensions rather than core)

  - id: infer-intent
    purpose: Infer why observed behavior exists without promoting guesses to facts.
    rules:
      - Inferred intent must be supported by evidence or marked uncertain.
      - Uncertain intent must not silently become a MUST requirement.
      - Rationale is written at the grain of what it justifies, in the slot that already holds that grain: whole-subject boundaries in the problem statement, a chapter's reason in its overview, a record's reason in that record. There is no design-intent record type and no design-intent section.
      - Before writing a reason, find the record it explains and check whether that record already states it. A reason held apart from its record is stated twice and verified nowhere.
      - Do not pre-announce an invariant as rationale. State the fact once, where an implementer is checked against it.

  - id: classify
    purpose: Separate essential semantics from incidental implementation choices.
    classes:
      - normative
      - implementation-defined
      - reference-specific
      - informative
      - unresolved
      - extension
    provenance:
      stance: recovered | owned (declared in the manifest)
      basis: observed | stated | derived (recorded on invariants, checked against cited evidence)
      evidence: records cite evidence-register entries via `evidence:` lists
    rules:
      - A detail a competent implementer would necessarily reconstruct from the rest of the specification may be omitted; a fact they could not discover (that a parameter exists, that a capability is optional, that a choice must be documented) must not be.
      - A capability cluster the subject can operate without is an extension, not a core requirement; do not promote it to core and do not drop it.
      - An implementation-defined choice that affects observable behavior carries a documentation obligation rather than silent freedom.
      - A mechanism whose only evidence is observed reference behavior is presumed implementation-defined. Promote it to normative only with a stated basis or a recorded semantic-necessity argument.
      - In a recovered specification, constants and mechanism shapes default to implementation-defined. In an owned specification, the owners may fix the values they chose as contract.

  - id: normalize
    purpose: Encode the recovered subject as connected specification records.
    rules:
      - Normative statements must constrain a model element or relationship rather than form an isolated inventory.
      - Interactions must connect participants, sequence, invariants, and failures where applicable.
      - Lifecycle records must express semantic state rather than incidental execution state.
      - Behavior records must be grouped into chapters cut by component, not by execution phase, when the subject spans more than one component.
      - Chapters must expand the declared layers in declared order. No chapter may use a term a later chapter defines; vocabulary two components share is hoisted into the domain model instead of forcing an order. A chapter that only assembles other chapters' outputs follows the last chapter it takes an input from. Extension chapters sort after every core chapter.
      - Operator-tunable behavior that changes normative semantics must be recorded as a parameter constraining the records it governs; concrete defaults stay implementation-defined unless the value itself is contractual. Each parameter carries a stable reference key.
      - The chapter that specifies how configuration resolves, reloads, and is validated claims `parameters` in its `contains:`, so the fields sit with the behavior that gives them effect. Leave it unclaimed only when no chapter owns configuration behavior.
      - State the reload contract once as `reload_default:`; give a field its own `reload:` only where it departs from that contract.
      - A parameter's `semantics:` states what the field itself means. Behavior that belongs to a record the parameter constrains is stated on that record.
      - Name every rendered list with `<field>_label` where the type default does not say what the list holds. Labels that repeat across dozens of records tell a reader nothing and train them to skim.
      - Concepts at data boundaries should carry typed field lists (attributes) so per-field facts — requiredness, ordering direction, comparison rules — are not lost in prose.
      - Extension records and chapters must be marked `conformance: extension`.
      - Interactions and invariants must carry falsifiable verification clauses; the renderer assembles them into the verification matrix.
      - Implementation-defined areas should list what a conforming implementation must document about its selected mechanism.
      - Examples on interfaces/parameters and reference algorithms on interactions are informative aids; they must not carry semantics absent from their record.
      - Redundant summaries (cheat sheet, checklist) are generated projections, never hand-written record content.
      - Prose is plain. Short declarative sentences, one fact per bullet, no comma-joined independent clauses. Split compound statements instead of merging them.

  - id: validate
    purpose: Detect structural gaps, lost intent, and accidental freezing of the current implementation.
    checks:
      - graph references resolve
      - identifiers are unique
      - concepts form an explicit model
      - responsibilities participate in interactions
      - interactions have semantic participants and an owner
      - invariants constrain behavior rather than float independently
      - failures are connected to interactions
      - lifecycle states are reachable from the declared initial state
      - chapter references resolve and every behavior record belongs to exactly one chapter when chapters are declared
      - the lifecycle and the configuration field list are each claimed by at most one chapter
      - no graph declares design_intents; rationale lives on the records it justifies
      - list labels name a list the record actually has
      - parameters name what they control and constrain resolvable records
      - conformance markers use a known level
      - interactions and invariants carry verification clauses
      - evidence references resolve and invariant basis claims are consistent with cited evidence kinds
      - recovered specifications cite evidence for every invariant
      - under-specification review
      - over-specification review
      - reference implementation separation

  - id: assemble
    purpose: Reconstruct the graph into coherent system-level views before rendering prose.
    required_views:
      - system model overview
      - responsibility and ownership view
      - abstraction levels (the declared decomposition, in reading order)
      - operator contract
      - component chapters, expanding the declared layers in declared order
      - interaction narratives
      - lifecycle narrative
      - failure model
      - verification matrix

  - id: render
    purpose: Generate SPEC.md as a coherent narrative projection rather than a record dump.
    reader_models:
      - transcriber: implements line by line from the scan path (operator contract, cheat sheet, field lists, verification matrix, checklist, examples, algorithms)
      - reconstructor: re-derives the design from the understanding path (intent, system model, chapters, invariants, failures)
    rules:
      - Resolve internal identifiers to semantic names in prose.
      - Preserve normative language exactly in meaning.
      - Explain relationships between records instead of merely listing them.
      - Serve both reader models; every normative fact must be reachable through the scan path and the understanding path.
      - Open with a reading guide that routes each reader model to its path.
      - State the specification's provenance stance so readers know whether fixed mechanisms are deliberate contract or recovered observation.
      - Project component chapters in declared order and place unassigned records in an appendix.
      - Number every subsection of a numbered section. Fold a structural subsection that ends up alone into its parent; never fold a list of records, where the heading carries a record's name.
      - Position the state machine and the operator contract where the graph puts them, not by record type. Only the analytical front is fixed.
      - Carry the referenced record's section number on every cross-reference, and drop the parenthetical when the record has no number.
      - Take a list's label from the record when it gives one; the record type supplies only a fallback.
      - Mark extension chapters and records so a reader can identify the omissible surface.
      - Assemble every verification clause into a single verification matrix grouped by chapter.
      - Do not add normative semantics that are absent from the source graph.
    output:
      - SPEC.md

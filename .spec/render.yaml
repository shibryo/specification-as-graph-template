      strategy: intent_context
    - title: Goals and Non-Goals
      strategy: goals
    - title: Design Intent
      strategy: explain_intent
    - title: System Model
      strategy: assemble_model_and_ownership
    - title: Core Interactions
      strategy: narrative_interactions
    - title: Lifecycle and State
      strategy: explain_state_machine
    - title: Interfaces and Interactions
      strategy: explain_interfaces
    - title: Invariants and Constraints
      strategy: explain_invariants
    - title: Failure and Recovery Semantics
      strategy: explain_failure_model
    - title: Implementation-Defined Areas
      strategy: explain_freedom
    - title: Reference Implementation
      strategy: explain_reference
    - title: Conformance
      strategy: explain_conformance

failures:
  - id: failure.tracker-unavailable
    name: Tracker Read Failure
    occurs_during:
      - interaction.poll-and-dispatch
      - interaction.reconcile-active-runs
      - interaction.reconcile-blocked-issues
      - interaction.retry-issue
      - interaction.startup-workspace-cleanup
    meaning: >
      A read against the tracker (discovery by states, refresh by identity,
      or the terminal-issue query) fails or the configuration needed to reach
      the tracker is invalid, so the orchestrator has no current answer about
      issue state.
    retryable: "yes"
    required_behavior:
      - Treat absence of an answer as unknown, never as withdrawal; keep all live runs, blocks, claims, and schedules unchanged.
      - Surface the failure reason for operator diagnosis.
      - Continue the polling cadence so the read is retried on the next pass; a retry evaluation whose read failed re-schedules itself with grown, bounded delay.
      - During startup cleanup, skip the cleanup and proceed with startup.
    recovery: >
      Normal operation resumes automatically at the next successful read; no
      state reconstruction is needed because nothing was revoked.

  - id: failure.agent-run-crash
    name: Agent Run Exits Abnormally
    occurs_during:
      - interaction.handle-run-completion
    meaning: >
      A live agent run terminates for any reason other than normal
      completion — crash, kill, or infrastructure error — without its last
      observed activity marking it as requiring operator input.
    retryable: "yes"
    required_behavior:
      - Free the run's capacity and keep the issue claimed.
      - Schedule a failure retry whose attempt continues the run's attempt history, carrying the exit reason and the run's worker-host and workspace affinity.
      - Record the ending with enough context (issue, session, reason) for diagnosis.
    recovery: >
      The retry evaluation re-reads the tracker and re-dispatches into the
      preserved workspace when the issue is still eligible and capacity
      allows, so prior partial work is available to the next run.

  - id: failure.run-stalled
    name: Agent Run Stalls
    occurs_during:
      - interaction.reconcile-active-runs
    meaning: >
      A live, non-blocked run has produced no observed activity for longer
      than the configured stall threshold (measured from the last agent event
      or, absent any event, from run start). A threshold of zero disables
      stall detection.
    retryable: "yes"
    required_behavior:
      - Stop the run promptly and free its capacity, preserving the issue's workspace.
      - If the run's activity marks it input-required, block the issue instead of retrying.
      - Otherwise schedule a failure retry continuing the attempt history, recording the stall duration as the error context.
    recovery: >
      Same as an abnormal exit, tracker-revalidated re-dispatch with bounded
      backoff into the preserved workspace.

  - id: failure.input-required
    name: Run Requires Operator Input
    occurs_during:
      - interaction.handle-run-completion
      - interaction.reconcile-active-runs
    meaning: >
      A run's observed activity shows it waiting on a human — an
      input-required or approval-required signal, an input-required
      completion outcome, or an elicitation request — whether the run then
      exits, crashes, or stalls.
    retryable: "no"
    required_behavior:
      - Stop any still-live run and free its capacity.
      - Create a blocked-issue record preserving the claim, a human-readable cause, the blocking moment, the last observed activity, and the placement.
      - Cancel any pending retry schedule for the issue; never create a new one while blocked.
      - Keep the block until a successful tracker read shows the issue terminal, non-active, unroutable, or absent.
    recovery: >
      A human resolves the situation out of band (answers in the tracker,
      changes state or routing); the next reconciliation observes the change
      and releases the claim, after which the issue may be scheduled afresh.

  - id: failure.spawn-failure
    name: Agent Run Fails to Start
    occurs_during:
      - interaction.dispatch-issue
    meaning: >
      An admitted dispatch cannot bring the agent run into existence (process
      or resource acquisition fails) after the issue was revalidated.
    retryable: "yes"
    required_behavior:
      - Record no live run and consume no capacity for the failed start.
      - Schedule a retry with incremented attempt, carrying the failure reason and the intended worker host.
    recovery: >
      The retry evaluation re-validates and re-dispatches; persistent
      inability to start surfaces as repeatedly growing retry delays visible
      to operators.

  - id: failure.capacity-exhausted-on-retry
    name: No Capacity at Retry Time
    occurs_during:
      - interaction.retry-issue
    meaning: >
      A retry comes due for a still-eligible issue, but the global limit, the
      issue-state limit, or worker-host capacity leaves no slot to admit it.
    retryable: "yes"
    required_behavior:
      - Do not overcommit; leave the issue claimed and re-schedule with an incremented attempt and grown, bounded delay.
      - Preserve the retry context (error, affinity) across the deferral.
    recovery: >
      A later retry evaluation admits the issue when capacity frees up; the
      bounded backoff guarantees re-evaluation keeps happening.

  - id: failure.workspace-provisioning-failed
    name: Workspace Provisioning Fails
    occurs_during:
      - interaction.provision-workspace
      - interaction.dispatch-issue
    meaning: >
      The issue's workspace cannot be produced, path validation rejects it,
      creation fails locally or on the remote host, the remote host cannot
      confirm an unambiguous result, or the after-create hook fails or times
      out.
    retryable: "yes"
    required_behavior:
      - Start no agent run for the issue on this attempt.
      - Remove a freshly created directory when provisioning fails after creation, so no half-initialized workspace persists.
      - Never bypass or weaken containment validation to make provisioning succeed.
      - Surface the cause, and follow the dispatch failure path (retry with backoff) for the issue.
    recovery: >
      Retries re-attempt provisioning; a reused (previously existing)
      workspace is left untouched by a failed provisioning attempt.

  - id: failure.workspace-cleanup-failed
    name: Workspace Removal Fails
    occurs_during:
      - interaction.startup-workspace-cleanup
      - interaction.retry-issue
    meaning: >
      A removal that should delete an issue's workspace cannot complete, the
      recorded path fails validation, the filesystem or remote host errors,
      or the remote command fails.
    retryable: "yes"
    required_behavior:
      - Report the failure with its cause; never escalate by deleting outside validated containment.
      - Leave orchestration decisions unaffected, claim release and scheduling proceed even when cleanup fails.
      - Treat before-remove hook failure as non-blocking for the removal itself.
    recovery: >
      A later cleanup opportunity (startup cleanup, a subsequent terminal
      observation) may remove the directory; stale directories are a space
      cost, not a correctness fault.

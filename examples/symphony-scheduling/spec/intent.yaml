context: >
  A team routes software work through an external issue tracker (Linear,
  GitHub, GitLab, Jira, Asana, or similar). Autonomous coding agents can work
  those issues without a human driving each step, but agent runs are long,
  expensive, and unreliable: they crash, stall silently, exceed rate limits,
  and sometimes reach a point where only a human operator can answer a
  question or grant an approval. Meanwhile the tracker keeps changing
  underneath the automation: humans close issues, reassign them, relabel them,
  or move them between workflow states at any moment. Multiple agent runs may
  execute in parallel on the local machine or on remote worker hosts, so each
  run needs an isolated working directory, and the machine's filesystem must
  be protected from misdirected cleanup.

problem: >
  Continuously decide which tracker issues an autonomous agent should be
  working on right now, start and supervise one agent run per selected issue
  without exceeding capacity, recover from run failures and stalls without
  losing work or looping hot, stop automation the moment the tracker withdraws
  an issue or a run needs a human, and create and destroy per-issue isolated
  workspaces without ever damaging unrelated files — all while treating the
  external tracker, not local memory, as the authority on what each issue's
  state is.

why_specification_exists: >
  The scheduling semantics — what makes an issue eligible, when exactly a run
  is started, retried, blocked, or abandoned, which side wins when local state
  and tracker state disagree, and which filesystem paths cleanup may ever
  touch — live implicitly in one large orchestration module. Without a
  specification, a reimplementation would have to rediscover safety-critical
  decisions (tracker authority, never auto-retrying input-required runs,
  workspace path containment, bounded backoff) by reverse engineering, and
  would likely copy incidental mechanisms (process topology, timer tokens,
  specific backoff constants) as if they were contractual.

goals:
  - Preserve the orchestration semantics independently of process model, timer mechanism, or tracker product.
  - Make the issue orchestration lifecycle, capacity rules, retry policy, and reconciliation authority explicit enough that a substantially different implementation can conform.
  - State workspace safety guarantees as hard invariants rather than incidental code paths.

non_goals:
  - Specify how an agent run performs the actual coding work, or the agent's internal protocol.
  - Specify tracker-specific APIs, authentication, or data mapping beyond the read contract the orchestrator requires.
  - Prescribe internal structure (single process vs. many, timer libraries, supervision trees) unless that structure is itself part of the contract.

design_intents:
  - name: Tracker is the source of truth
    intent: >
      The external issue tracker is authoritative for an issue's workflow
      state, routing, and existence. The orchestrator holds only a local,
      revocable claim; whenever local belief and tracker state diverge, the
      tracker wins.
    why_it_matters: >
      Humans and other tools operate on the tracker concurrently. If local
      orchestration state could override the tracker, a closed or reassigned
      issue could keep consuming an agent, or work could be silently dropped.
    implications:
      - Every dispatch is preceded by a fresh revalidation of the issue against the tracker.
      - Active and blocked issues are periodically re-read from the tracker, and runs are stopped when the tracker withdraws eligibility.
      - Transient tracker read failures must not be treated as withdrawal; existing runs are kept.
    tradeoffs:
      - Convergence to tracker truth is eventual (bounded by the reconciliation cadence), not instantaneous.

  - name: Progress by supervised restart, not by trust
    intent: >
      Agent runs are assumed unreliable. A normal exit is not proof the issue
      is finished, a crash is not fatal to the issue, and silence is treated
      as failure. The orchestrator converges by re-checking the tracker and
      re-dispatching with bounded backoff.
    why_it_matters: >
      Long-running autonomous work fails in ways the run itself cannot always
      report; the scheduler must supply the reliability the runs lack.
    implications:
      - Normal completion triggers a prompt continuation check rather than terminal bookkeeping.
      - Failures and stalls are retried with growing, bounded delays that preserve attempt history and placement affinity.
      - A run that requires operator input is excluded from automatic restart entirely.
    tradeoffs:
      - An issue may be dispatched multiple times; agent work must tolerate re-entry into an existing workspace.

  - name: Isolation with strict containment
    intent: >
      Each issue gets exactly one deterministic, isolated workspace, and
      destructive filesystem operations are confined to provable descendants
      of the configured workspace root.
    why_it_matters: >
      Parallel agents share hosts with each other and with the operator's own
      files; a single unconfined recursive delete is catastrophic.
    implications:
      - Workspace identity is derived deterministically and collision-safely from the issue identifier.
      - Path containment is validated (including symlink escape) before any removal.
      - Cleanup failures are surfaced or skipped, never worked around by loosening containment.
    tradeoffs:
      - Some stale workspaces may survive until an eligible cleanup opportunity rather than being force-removed.

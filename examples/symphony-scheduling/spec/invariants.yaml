invariants:
  - id: invariant.single-run-per-issue
    name: Single Run Per Issue
    statement: >
      At any moment, at most one live agent run exists per issue, and an
      issue that is claimed — running, awaiting retry, or blocked — is never
      admitted for a new dispatch until its claim is released.
    intent: >
      Two concurrent runs of the same issue would race in the same workspace
      and against the same tracker item; the claim makes exclusive ownership
      explicit across all pending forms of work.
    prevents:
      - Duplicate concurrent runs corrupting a shared workspace.
      - A retry firing while the previous run of the same issue is still alive.
      - Re-dispatching an issue an operator is being asked to unblock.
    verification:
      - Present the same eligible issue in consecutive scheduling passes while a run, retry schedule, or block for it exists, and verify no second run starts.

  - id: invariant.concurrency-limits
    name: Concurrency Limits Hold at Admission
    statement: >
      A run is admitted only when, at admission time, the count of live runs
      stays within the global limit, within the configured limit for the
      issue's workflow state, and within the capacity of the chosen worker
      host; admissions within one scheduling pass observe each other's
      consumption.
    intent: >
      Capacity is a shared budget across three dimensions; checking each
      dimension at the moment of admission keeps the budget honest even when
      many candidates arrive in the same pass.
    prevents:
      - Overcommitting hosts or the whole system when a pass finds more candidates than slots.
      - One workflow state's issues starving the limits set aside for another state.
    verification:
      - Offer more eligible issues than each limit permits and verify the run count never exceeds any of the three limits, including mid-pass.

  - id: invariant.tracker-authority
    name: Tracker Authority Converges
    statement: >
      No local claim, run, retry schedule, or block outlives tracker
      withdrawal, once a successful tracker read shows an issue terminal,
      outside the active states, unroutable, or absent, the orchestrator
      revokes the corresponding local state within the current reconciliation
      or retry evaluation; a failed read revokes nothing.
    intent: >
      Humans and other tools change the tracker at will; local orchestration
      state is a cache with defined, prompt revocation, and outage never
      masquerades as withdrawal.
    prevents:
      - Agents continuing to burn resources on closed, reassigned, or deleted issues.
      - Mass termination of healthy runs during a tracker outage.
    verification:
      - Move a running issue to a terminal state, to a non-active state, and out of routing, and verify the run stops by the next reconciliation in each case.
      - Fail the reconciliation read and verify all runs and blocks survive.

  - id: invariant.dispatch-freshness
    name: Dispatch Uses a Fresh Snapshot
    statement: >
      Every run is started from an issue snapshot read from the tracker
      immediately before the run starts, and only if that fresh snapshot is
      still a valid dispatch candidate.
    intent: >
      Between discovery and dispatch (or across a retry delay) the issue may
      have been closed, blocked, or reassigned; the last read before launch
      closes that window.
    prevents:
      - Launching work from a stale poll result or from retry metadata that no longer reflects the tracker.
    verification:
      - Change an issue to a non-candidate state between poll and dispatch and verify the dispatch is skipped without error.

  - id: invariant.backoff-bounded
    name: Retry Backoff Grows and Is Bounded
    statement: >
      Failure retry delays are strictly positive, non-decreasing in the
      attempt number, and never exceed the configured maximum backoff; the
      attempt number carried by a retry continues the issue's prior attempt
      history rather than resetting on each failure. The continuation check
      after a normal completion uses a short fixed delay and does not count
      as a failure attempt.
    intent: >
      Growth prevents hot-looping against a persistently failing issue or
      tracker; the bound preserves eventual re-evaluation; preserved history
      keeps growth meaningful across successive failures.
    prevents:
      - Tight crash-restart loops consuming capacity and tracker quota.
      - Unbounded delays that would effectively abandon an issue.
    verification:
      - Force repeated failures and verify the observed delays are non-decreasing, capped at the configured maximum, and derived from a continuing attempt count.

  - id: invariant.blocked-not-retried
    name: Blocked Issues Are Never Auto-Retried
    statement: >
      Once a run's observed activity marks it as requiring operator input or
      approval, the issue is blocked, not retried, no retry schedule is
      created for it, stall handling does not restart it, and it remains
      blocked until a successful tracker read shows a relevant change.
    intent: >
      Restarting a run that is waiting on a human discards the question being
      asked and can loop forever; the block converts the situation into an
      operator-visible escalation.
    prevents:
      - Infinite restart loops on runs that always stop to ask for approval.
      - Silently discarding an agent's request for human input.
    verification:
      - End and stall runs in input-required conditions and verify a block (not a retry) results, and that only tracker change releases it.

  - id: invariant.workspace-containment
    name: Workspace Containment
    statement: >
      Every workspace path used for creation or destructive removal resolves
      strictly inside the configured workspace root for its placement, is
      never equal to the root, and does not escape the root through symlinks;
      paths failing validation are rejected, not repaired.
    intent: >
      Recursive deletion is the most dangerous operation the orchestrator
      performs; containment converts a misconfiguration or crafted identifier
      into a refusal instead of data loss.
    prevents:
      - Deleting the workspace root or arbitrary directories via traversal, absolute-path, or symlink tricks.
    verification:
      - Attempt provisioning and removal with paths that equal the root, live outside it, and symlink out of it, and verify each is rejected with no filesystem effect.

  - id: invariant.workspace-per-issue
    name: Deterministic Workspace Identity
    statement: >
      An issue's workspace identity is a pure function of its human-readable
      identifier, safe for use as a directory name, and collision-free, two
      distinct identifiers never yield the same identity, and any party
      knowing only the identifier derives the same identity.
    intent: >
      Determinism lets retries and continuations resume prior work, and lets
      cleanup target exactly the right directory from an identifier alone;
      collision-freedom keeps isolation honest when identifiers contain
      unsafe characters.
    prevents:
      - Two issues sharing (and corrupting) one workspace after identifier sanitization.
      - Cleanup removing a different issue's workspace.
    verification:
      - Derive identities for identifiers that sanitize to the same safe form and verify they differ; derive the same identifier twice from different call sites and verify equality.

# Orchestration lifecycle of one issue, as seen by the orchestrator.
# This is the local claim lifecycle; the tracker's own workflow states are a
# separate, authoritative dimension that drives several transitions here.
initial_state: state.eligible
terminal_states:
  - state.released
states:
  - id: state.eligible
    name: Eligible
    meaning: >
      The tracker reports the issue in an active workflow state, routed to
      this orchestrator, and no local claim exists. The issue competes for
      capacity in every scheduling pass.
  - id: state.running
    name: Running
    meaning: >
      The issue is claimed and exactly one live agent run is working it in
      its workspace on a chosen placement.
  - id: state.awaiting-retry
    name: Awaiting Retry
    meaning: >
      The issue is claimed with a single pending retry schedule; no run is
      live. This covers both the continuation check after a normal run
      completion and backoff waits after failures, stalls, or capacity
      contention.
  - id: state.blocked
    name: Blocked
    meaning: >
      The issue is claimed but automation is suspended because its run
      required operator input or approval; diagnostic context is preserved
      for the operator. Only tracker-observed change leaves this state.
  - id: state.released
    name: Released
    meaning: >
      The local claim is gone; the orchestrator holds no run, schedule, or
      block for the issue. This ends the orchestration episode. If the
      tracker later shows the issue active and routable again, a new episode
      begins as Eligible.
transitions:
  - from: state.eligible
    to: state.running
    trigger: A scheduling pass admits the issue and dispatch starts an agent run.
  - from: state.eligible
    to: state.awaiting-retry
    trigger: Dispatch is admitted but starting the agent run fails, so a retry is scheduled.
  - from: state.running
    to: state.awaiting-retry
    trigger: >
      The run ends normally (continuation check), ends abnormally (failure
      retry), or is stopped as stalled without an input-required marker.
  - from: state.running
    to: state.blocked
    trigger: >
      The run ends or stalls while its observed activity marks it as
      requiring operator input or approval.
  - from: state.running
    to: state.released
    trigger: >
      Reconciliation observes the issue terminal, outside the active states,
      unroutable, or absent from a successful tracker read; the run is
      stopped and the claim released.
  - from: state.awaiting-retry
    to: state.running
    trigger: >
      The retry comes due, the fresh tracker snapshot is still a dispatch
      candidate, capacity admits it, and dispatch starts a run.
  - from: state.awaiting-retry
    to: state.awaiting-retry
    trigger: >
      The retry comes due but the tracker read fails or capacity is
      unavailable; the retry is re-scheduled with a grown, bounded delay.
  - from: state.awaiting-retry
    to: state.released
    trigger: >
      The retry comes due and the fresh snapshot is terminal (workspace also
      removed), no longer a candidate, or absent.
  - from: state.blocked
    to: state.released
    trigger: >
      Reconciliation observes the issue terminal (workspace also removed),
      outside the active states, unroutable, or absent from a successful
      tracker read.
normative:
  - An issue holds at most one claim, and a claim implies exactly one of Running, Awaiting Retry, or Blocked.
  - No transition out of Blocked is driven by elapsed time or by the run itself; only tracker-observed change releases a block.
  - Release caused by a terminal tracker state also removes the issue's workspace; release for any other reason preserves it.
  - A normal run exit never transitions directly to Released; the continuation check in Awaiting Retry must consult the tracker first.

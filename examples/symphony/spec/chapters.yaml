chapters:
  - id: chapter.intake
    name: Work Intake and Dispatch
    overview: >
      How the board becomes running agents. This chapter defines what makes a Work
      Item a candidate, in what order candidates are taken, what stops a dispatch,
      and the read boundary every one of those decisions goes through. Every rule
      here is expressed over a normalized Work Item, because scheduling rules
      written against one tracker's fields cannot be reused and every new provider
      would otherwise reopen the scheduler. The board stays authoritative
      throughout, at the price of reading the Work Source more often than a
      cache-first design would.
    contains:
      - interaction.poll-and-dispatch
      - interface.work-source-adapter
      - invariant.single-claim
      - invariant.dispatch-order-deterministic
      - invariant.concurrency-limits-respected
      - invariant.dispatch-revalidated
      - failure.work-source-unavailable

  - id: chapter.isolation
    name: Isolated Execution Environment
    overview: >
      Where a run happens and what keeps it contained. This chapter defines workspace
      identity, the containment rule the whole subject depends on, and the operator's
      hooks into the workspace lifecycle.
    contains:
      - interaction.prepare-workspace
      - interface.workspace-hooks
      - invariant.workspace-containment
      - invariant.workspace-identity-deterministic
      - failure.workspace-preparation-failed
      - failure.hook-failed

  - id: chapter.session
    name: Agent Session and Turn Continuation
    overview: >
      What the agent is told, what it is allowed to do, and how the subject decides
      whether one more Turn is worth starting. This chapter also carries the rule
      that keeps the subject's credentials out of the agent.
    contains:
      - interaction.run-agent-session
      - interaction.continue-or-conclude-run
      - interface.agent-session
      - interface.prompt-template
      - invariant.agent-environment-excludes-credentials
      - invariant.turn-budget-bounded
      - failure.session-start-failed
      - failure.turn-failed

  - id: chapter.recovery
    name: Claim Lifecycle, Interruption, and Recovery
    overview: >
      What happens between runs. This chapter defines the states a Claim moves
      through, how the subject re-aligns with the board, how failure becomes another
      attempt, how a silent run is reclaimed, and how a run waiting on a human is
      held rather than retried. Failure schedules another attempt rather than
      stopping, because an orchestrator that stops on first failure needs an
      operator to restart it.
    contains:
      - lifecycle
      - interaction.reconcile-claimed-items
      - interaction.retry-after-failure
      - interaction.detect-stalled-run
      - interaction.hold-blocked-item
      - interaction.release-claim-and-clean-up
      - invariant.claim-follows-eligibility
      - invariant.retry-backoff-bounded
      - invariant.blocked-item-not-retried
      - failure.run-stalled
      - failure.operator-input-required
      - failure.work-item-disappeared

  - id: chapter.configuration
    name: Configuration and Reload
    overview: >
      The one document an operator edits, and the guarantee that editing it badly
      cannot take a working deployment down.
    contains:
      - interaction.load-and-reload-configuration
      - interface.workflow-definition
      - invariant.last-known-good-configuration
      - failure.invalid-configuration

  - id: chapter.observability
    name: Observability
    overview: >
      What an operator can see and how they can ask the subject to look again. This
      chapter also states how resource usage is accounted so that cost figures stay
      trustworthy.
    contains:
      - interaction.publish-runtime-state
      - interface.runtime-state
      - interface.observability-service
      - invariant.token-totals-monotonic

  - id: chapter.distributed
    name: Distributed Execution
    conformance: extension
    overview: >
      Spreading runs across several execution locations. A conforming implementation
      may run everything locally and omit this chapter entirely.
    contains:
      - interaction.run-on-remote-worker
      - invariant.run-does-not-hop-hosts
      - failure.worker-host-unreachable

  - id: chapter.agent-tools
    name: Provider-Native Agent Tools
    conformance: extension
    overview: >
      Letting the agent act on the board through the subject's credential instead of
      its own. A conforming implementation may omit this chapter; the agent then
      needs its own access, or none.
    contains:
      - interaction.execute-agent-tool
      - interface.agent-tool
      - failure.agent-tool-failed

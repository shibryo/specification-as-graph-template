# What this recovery actually consulted. Sources are relative to the reference
# anchor in reference.yaml. No prior specification of this subject was read.
evidence:
  - id: evidence.readme-project
    kind: doc
    source: README.md
    note: >
      States the subject's purpose. Teams should manage work rather than supervise
      coding agents.

  - id: evidence.readme-implementation
    kind: doc
    source: elixir/README.md
    note: >
      Describes the poll-workspace-session loop, blocked handling, concurrency and
      turn limits, credential removal from the agent, hook usage, reload behavior,
      and the optional observability service.

  - id: evidence.agents-conventions
    kind: statement
    source: elixir/AGENTS.md
    note: >
      Project constraints from the implementers: never run an agent turn in the
      source repository, keep workspaces under the configured root, and preserve
      retry, reconciliation, and cleanup semantics.

  - id: evidence.token-accounting-doc
    kind: doc
    source: elixir/docs/token_accounting.md
    note: >
      States how cumulative and incremental usage reports differ and why only
      cumulative reports may drive totals.

  - id: evidence.logging-doc
    kind: doc
    source: elixir/docs/logging.md
    note: Required diagnostic context for issue-scoped and session-scoped events.

  - id: evidence.workflow-example
    kind: doc
    source: elixir/WORKFLOW.md
    note: A working operator contract document with settings and a prompt template.

  - id: evidence.orchestrator-code
    kind: code
    source: elixir/lib/symphony_elixir/orchestrator.ex
    note: >
      Claims, candidate filtering, dispatch ordering, concurrency limits, retry
      scheduling and backoff, stall detection, blocking, reconciliation, and the
      runtime state snapshot.

  - id: evidence.agent-runner-code
    kind: code
    source: elixir/lib/symphony_elixir/agent_runner.ex
    note: >
      One run's lifecycle: worker selection, workspace, hooks, session, turn loop,
      and the continuation decision bounded by the turn budget.

  - id: evidence.workspace-code
    kind: code
    source: elixir/lib/symphony_elixir/workspace.ex
    note: >
      Workspace identity derivation, containment checks against the configured root,
      reuse of existing directories, hook execution, and removal.

  - id: evidence.path-safety-code
    kind: code
    source: elixir/lib/symphony_elixir/path_safety.ex
    note: Link-resolving canonicalization used before any containment decision.

  - id: evidence.app-server-code
    kind: code
    source: elixir/lib/symphony_elixir/codex/app_server.ex
    note: >
      Session startup in the workspace, credential variables removed from the agent
      environment, approval handling, tool-call dispatch, update stream, and the
      turn silence timeout.

  - id: evidence.config-schema-code
    kind: code
    source: elixir/lib/symphony_elixir/config/schema.ex
    note: >
      The full settable surface with defaults, validation rules, environment-backed
      values, and the default sandbox policy rooted at the workspace.

  - id: evidence.workflow-store-code
    kind: code
    source: elixir/lib/symphony_elixir/workflow_store.ex
    note: >
      Load, validate, re-read, and last-known-good behavior, including refusal to
      start without a valid definition.

  - id: evidence.tracker-boundary-code
    kind: code
    source: elixir/lib/symphony_elixir/tracker.ex
    note: >
      The adapter boundary: reads by state and by identity, tool advertisement, and
      the per-session binding of adapter settings.

  - id: evidence.issue-model-code
    kind: code
    source: elixir/lib/symphony_elixir/tracker/issue.ex
    note: The normalized work item fields and the label-matching rule.

  - id: evidence.prompt-builder-code
    kind: code
    source: elixir/lib/symphony_elixir/prompt_builder.ex
    note: Strict template rendering over work item fields and the attempt number.

  - id: evidence.presenter-code
    kind: code
    source: elixir/lib/symphony_elixir_web/presenter.ex
    note: The projection of running, retrying, and blocked entries with their reasons.

  - id: evidence.ssh-code
    kind: code
    source: elixir/lib/symphony_elixir/ssh.ex
    note: Remote execution transport used for distributed worker hosts.

  - id: evidence.test-dispatch-eligibility
    kind: test
    source: elixir/test/symphony_elixir/core_test.exs
    note: >
      Items missing a required label, routed elsewhere, or marked blocked by the
      provider are not dispatch-eligible.

  - id: evidence.test-dispatch-ordering
    kind: test
    source: elixir/test/symphony_elixir/core_test.exs
    note: Dispatch is ordered by priority and then by oldest creation time.

  - id: evidence.test-dispatch-revalidation
    kind: test
    source: elixir/test/symphony_elixir/core_test.exs
    note: >
      Dispatch is skipped when a revalidating read shows a removed label, changed
      routing, or a missing item.

  - id: evidence.test-concurrency-limits
    kind: test
    source: elixir/test/symphony_elixir/extensions_test.exs
    note: >
      Per-host capacity is respected, full hosts are skipped, and dispatch defers
      when every host is full.

  - id: evidence.test-reconciliation
    kind: test
    source: elixir/test/symphony_elixir/core_test.exs
    note: >
      Terminal items stop the run and clean the workspace; non-active, unrouted, and
      missing items stop the run without cleaning it.

  - id: evidence.test-retry-backoff
    kind: test
    source: elixir/test/symphony_elixir/core_test.exs
    note: >
      Abnormal exits increase the retry attempt progressively, a first failure waits
      before retrying, and superseded retry signals are ignored.

  - id: evidence.test-blocking
    kind: test
    source: elixir/test/symphony_elixir/orchestrator_status_test.exs
    note: >
      Runs that report required input, approval, or elicitation become blocked
      instead of being retried.

  - id: evidence.test-stall-restart
    kind: test
    source: elixir/test/symphony_elixir/orchestrator_status_test.exs
    note: Stalled runs are restarted with backoff unless they are waiting on input.

  - id: evidence.test-turn-continuation
    kind: test
    source: elixir/test/symphony_elixir/core_test.exs
    note: >
      A further turn runs while the item stays active, and continuation stops at the
      configured turn budget or when a required label is removed.

  - id: evidence.test-workspace-containment
    kind: test
    source: elixir/test/symphony_elixir/workspace_and_config_test.exs
    note: >
      Link escapes are rejected on creation and on recorded removal, and the
      workspace root itself is refused with a distinct error.

  - id: evidence.test-workspace-identity
    kind: test
    source: elixir/test/symphony_elixir/workspace_and_config_test.exs
    note: >
      Workspace paths are deterministic per identifier, identifiers that sanitize
      alike stay distinct, and existing content survives reuse.

  - id: evidence.test-config-reload
    kind: test
    source: elixir/test/symphony_elixir/workspace_and_config_test.exs
    note: >
      An invalid reload keeps the last good settings, and a missing definition stops
      startup.

  - id: evidence.test-token-accounting
    kind: test
    source: elixir/test/symphony_elixir/orchestrator_status_test.exs
    note: >
      Totals accumulate from cumulative reports only and ignore incremental figures
      without a cumulative total.

  - id: evidence.test-remote-worker
    kind: test
    source: elixir/test/symphony_elixir/extensions_test.exs
    note: >
      Remote workspace lifecycle over configured hosts, and startup failures surface
      instead of silently moving the run to another host.

  - id: evidence.test-agent-tool
    kind: test
    source: elixir/test/symphony_elixir/dynamic_tool_test.exs
    note: >
      Provider-native tools are advertised, executed host-side against session-bound
      settings, and return structured failures for unknown or malformed calls.

  - id: evidence.test-observability
    kind: test
    source: elixir/test/symphony_elixir/orchestrator_status_test.exs
    note: >
      The snapshot carries poll countdown, checking status, retry entries, blocked
      entries, session identity, and usage totals.

  - id: evidence.behavior-restart-clears-blocks
    kind: behavior
    source: elixir/README.md and elixir/lib/symphony_elixir/orchestrator.ex
    note: >
      Blocked entries live only in memory, so restarting the service makes a still
      active item a dispatch candidate again.

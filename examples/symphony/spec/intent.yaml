context: >
  Teams keep their work on a tracker board. Coding agents can now carry a work item
  a long way without step-by-step supervision. Each agent run still needs a checkout
  to work in, a task description, credentials, and someone watching whether it is
  still making progress.

problem: >
  Turning a board of work into autonomous agent runs is unmanaged. Nothing decides
  which items deserve an agent right now. Nothing gives each run an isolated place
  to work. Nothing keeps a run going until the item leaves the active set. Nothing
  notices that a run has stopped making progress or is waiting for a human. Done by
  hand this does not scale past one agent. Done naively, runs collide in a shared
  checkout, two runs pick up the same item, operator credentials reach agent
  processes, and a silently stalled run holds capacity forever.

why_specification_exists: >
  The valuable knowledge here is scheduling and containment policy, not the tracker
  API or the agent protocol that a given deployment happens to use. Without a
  specification that knowledge stays welded to one tracker, one agent runtime, and
  one process model. This document states what an orchestrator must decide, what it
  must isolate, and what it must expose, so the same subject can be rebuilt against
  a different board, a different agent, and a different execution topology.

goals:
  - Let operators manage work instead of supervising individual agent runs.
  - Keep at most one agent working on a work item at a time.
  - Give every run an isolated workspace so concurrent runs never interfere.
  - Keep a run going while its work item stays active.
  - Recover from failure automatically without operator action.
  - Distinguish a run that failed from a run that is waiting for a human.
  - Make progress, cost, and blockage of every run externally observable.
  - Keep the subject portable across trackers and coding agents.

non_goals:
  - Define how a coding agent reasons about or edits code.
  - Define the tracker's own workflow, state names, or permission model.
  - Guarantee that work is completed. The subject schedules work.
  - Replace human review of the agent's output.
  - Prescribe a process, threading, or deployment topology.

context: >
  Teams keep their work on a tracker board. Coding agents can now carry a work item
  a long way without step-by-step supervision. Each agent run still needs a checkout
  to work in, a task description, credentials, and someone watching whether it is
  still making progress.

problem: >
  Turning a board of work into autonomous agent runs is unmanaged. Nothing decides
  which items deserve an agent right now. Nothing gives each run an isolated place
  to work. Nothing keeps a run going until the item leaves the active set. Nothing
  notices that a run has stopped making progress or is waiting for a human. Done by
  hand this does not scale past one agent. Done naively, runs collide in a shared
  checkout, two runs pick up the same item, operator credentials reach agent
  processes, and a silently stalled run holds capacity forever.

why_specification_exists: >
  The valuable knowledge here is scheduling and containment policy, not the tracker
  API or the agent protocol that a given deployment happens to use. Without a
  specification that knowledge stays welded to one tracker, one agent runtime, and
  one process model. This document states what an orchestrator must decide, what it
  must isolate, and what it must expose, so the same subject can be rebuilt against
  a different board, a different agent, and a different execution topology.

goals:
  - Let operators manage work instead of supervising individual agent runs.
  - Keep at most one agent working on a work item at a time.
  - Give every run an isolated workspace so concurrent runs never interfere.
  - Keep a run going while its work item stays active.
  - Recover from failure automatically without operator action.
  - Distinguish a run that failed from a run that is waiting for a human.
  - Make progress, cost, and blockage of every run externally observable.
  - Keep the subject portable across trackers and coding agents.

non_goals:
  - Define how a coding agent reasons about or edits code.
  - Define the tracker's own workflow, state names, or permission model.
  - Guarantee that work is completed. The subject schedules work.
  - Replace human review of the agent's output.
  - Prescribe a process, threading, or deployment topology.

design_intents:
  - name: The work source is authoritative
    intent: >
      The tracker decides whether a work item still deserves an agent. The subject
      re-reads the item before acting instead of trusting its own memory.
    why_it_matters: >
      Board state changes while a run is in flight. Humans close items, reassign
      them, and strip labels. An orchestrator that trusts its own cache keeps
      burning agent time on work nobody wants any more.
    implications:
      - Dispatch decisions are revalidated against a fresh read immediately before dispatch.
      - Claimed items are re-read every cycle and released when they stop qualifying.
      - Local runtime state is a cache of tracker state, never a substitute for it.
    tradeoffs:
      - The subject reads the work source more often than a cache-first design would.

  - name: One claim, one workspace, one run
    intent: >
      A work item under orchestration is owned by exactly one claim. That claim owns
      one workspace and at most one active agent run.
    why_it_matters: >
      Two agents on one item duplicate work and fight over the same branch. Two runs
      in one directory corrupt each other's checkout.
    implications:
      - Claim, workspace identity, and run are all keyed by the same work item.
      - A second dispatch of a claimed item is refused rather than queued.

  - name: Blocked is not failed
    intent: >
      A run that stops because it needs operator input is held and surfaced. It is
      not retried and not released.
    why_it_matters: >
      Retrying a run that is waiting for a human wastes capacity and hides the
      request. The operator never learns that a decision is pending.
    implications:
      - Requests for input, approval, or elicitation move the item to a blocked state.
      - A blocked item keeps its claim so nothing else picks the item up.
      - Blocked items are visible in the runtime state with the reason they blocked.

  - name: Fail into a retry, not into a stop
    intent: >
      Every failure that is not a request for human input results in a scheduled
      retry with growing delay, until the work item stops qualifying.
    why_it_matters: >
      Trackers, networks, and agent runtimes fail transiently. An orchestrator that
      stops on first failure needs an operator to restart it.
    implications:
      - Failure paths schedule a retry rather than releasing the claim.
      - Repeated failure backs off instead of hammering the failing dependency.
      - The claim is released only when the work item itself stops qualifying.

  - name: Contain the agent
    intent: >
      The agent runs inside a workspace that belongs to its work item and receives
      no credential that the orchestrator uses to read the board.
    why_it_matters: >
      An autonomous agent with a writable path outside its workspace can damage the
      source repository. An agent holding the orchestrator's tracker token can act
      on the board outside the orchestrator's policy.
    implications:
      - The workspace path is verified to resolve inside the configured root.
      - Credential-bearing environment variables are removed before the agent starts.
    tradeoffs:
      - Agents that legitimately need tracker access must be granted it explicitly.

  - name: Providers are adapters, not policy
    intent: >
      Scheduling policy is expressed over a normalized work item. Provider-specific
      reads, identifiers, and capabilities stay behind an adapter boundary.
    why_it_matters: >
      Scheduling rules that are written against one tracker's fields cannot be
      reused, and every new provider reopens the scheduler.
    implications:
      - The scheduler depends only on normalized read operations.
      - Provider-native capabilities are offered to the agent, not to the scheduler.

interactions:
  - id: interaction.poll-and-dispatch
    name: Poll and Dispatch
    purpose: >
      Turn the current contents of the Work Source into new Agent Runs, without
      exceeding any limit and without ever starting a second run for one item.
    participants:
      - responsibility.scheduler
      - responsibility.work-source-adapter
      - concept.work-source
      - concept.work-item
      - concept.claim
      - concept.agent-run
    owner: responsibility.scheduler
    trigger: The poll interval elapses, or an operator requests an immediate cycle.
    preconditions:
      - A valid Workflow Definition is effective.
      - Claims and blocked items have been reconciled against the Work Source.
    sequence:
      - actor: responsibility.scheduler
        action: Read the Work Items currently in the configured active states.
      - actor: responsibility.work-source-adapter
        action: Return normalized Work Items, dropping records that cannot be normalized.
      - actor: responsibility.scheduler
        action: Discard items that are already claimed, running, or blocked.
      - actor: responsibility.scheduler
        action: Discard items that lack a required label or are not routed to this deployment.
      - actor: responsibility.scheduler
        action: Order the remaining candidates deterministically.
      - actor: responsibility.scheduler
        action: For each candidate in order, stop when any applicable concurrency limit is reached.
      - actor: responsibility.scheduler
        action: Re-read the candidate immediately and abandon it if it no longer qualifies.
      - actor: responsibility.scheduler
        action: Take a Claim on the candidate and start an Agent Run for it.
      - actor: responsibility.scheduler
        action: Schedule the next poll and publish the updated state.
    postconditions:
      - Every started run corresponds to exactly one new Claim.
      - No concurrency limit is exceeded.
      - The next poll is scheduled.
    requirements:
      - level: must
        statement: Select only Work Items that are in a configured active state.
      - level: must_not
        statement: Select a Work Item that is in a configured terminal state.
      - level: must
        statement: Require every configured label before an item may be dispatched.
      - level: must
        statement: Re-read a candidate immediately before dispatching it.
      - level: must_not
        statement: Start a run for a Work Item that is already claimed.
      - level: should
        statement: Treat a provider readiness signal as necessary, never as sufficient.
      - level: must
        statement: Continue polling after a read failure rather than stopping.
    invariants:
      - invariant.single-claim
      - invariant.dispatch-order-deterministic
      - invariant.concurrency-limits-respected
      - invariant.dispatch-revalidated
    failures:
      - failure.work-source-unavailable
    algorithm: |
      candidates = work_source.read(active_states)
      candidates = [i for i in candidates if valid(i) and routed(i) and has_required_labels(i)]
      candidates = [i for i in candidates if not claimed(i) and not running(i) and not blocked(i)]
      sort candidates by (priority, created_at, identifier)
      for item in candidates:
          if not global_slot_free() or not state_slot_free(item) or not location_slot_free():
              break
          fresh = work_source.read_by_id(item.id)
          if fresh is missing or not qualifies(fresh):
              continue
          claim(fresh); start_run(fresh)
    verification:
      - Offer more qualifying items than the configured limit and verify no run exceeds the limit.
      - Present a claimed item again in the same cycle and verify no second run starts.
      - Move an item to a terminal state between read and dispatch, then verify no run starts.
      - Remove a required label between read and dispatch, then verify no run starts.
      - Present items with mixed priority and creation time, then verify dispatch order.

  - id: interaction.prepare-workspace
    name: Prepare the Isolated Workspace
    purpose: >
      Give an Agent Run a working directory that belongs to its Work Item, is proven
      to be inside the configured root, and is bootstrapped on first creation.
    participants:
      - responsibility.run-supervisor
      - responsibility.workspace-manager
      - concept.work-item
      - concept.workspace
      - concept.worker-host
      - concept.agent-run
    owner: responsibility.workspace-manager
    trigger: An Agent Run is starting for a claimed Work Item.
    preconditions:
      - The Work Item has a non-empty identifier.
      - A workspace root is configured for the execution location.
    sequence:
      - actor: responsibility.run-supervisor
        action: Request the Workspace for this Work Item at the run's execution location.
      - actor: responsibility.workspace-manager
        action: Derive the workspace identity deterministically from the item identifier.
      - actor: responsibility.workspace-manager
        action: Resolve the workspace path and verify it lies inside the configured root.
      - actor: responsibility.workspace-manager
        action: Reuse the directory when it already exists, otherwise create it.
      - actor: responsibility.workspace-manager
        action: Run the creation hook only when the directory was newly created.
      - actor: responsibility.workspace-manager
        action: Discard a newly created workspace whose creation hook failed.
      - actor: responsibility.run-supervisor
        action: Run the pre-run hook and abandon the run if it fails.
      - actor: responsibility.run-supervisor
        action: Report the resolved workspace location to the scheduler.
    postconditions:
      - The run has a workspace inside the configured root, or the run has failed.
      - A newly created workspace that failed bootstrap no longer exists.
      - Existing work from an earlier run for the same item is preserved.
    requirements:
      - level: must
        statement: Verify containment after resolving links, not before.
      - level: must_not
        statement: Use the configured workspace root itself as a workspace.
      - level: must
        statement: Run the creation hook only on the run that created the directory.
      - level: must
        statement: Treat a creation-hook failure as a failure of the whole run.
      - level: must
        statement: Preserve existing workspace content across runs for the same item.
      - level: must
        statement: Bound every hook by the configured hook timeout.
      - level: should
        statement: Truncate hook output before logging it.
    invariants:
      - invariant.workspace-containment
      - invariant.workspace-identity-deterministic
    failures:
      - failure.workspace-preparation-failed
      - failure.hook-failed
    verification:
      - Point the workspace path at a link that escapes the root and verify the run is refused.
      - Request the workspace for the same identifier twice and verify one identity results.
      - Request workspaces for two identifiers that sanitize alike and verify they stay distinct.
      - Fail the creation hook and verify the new workspace is removed and the run fails.
      - Leave a file in an existing workspace, run again, and verify the file survives.
      - Hang a hook past the configured timeout and verify the hook is abandoned.

  - id: interaction.run-agent-session
    name: Run the Agent Session
    purpose: >
      Start a contained agent session inside the run's Workspace, deliver the work as
      a prompt, and observe the agent until the turn ends.
    participants:
      - responsibility.run-supervisor
      - responsibility.session-client
      - concept.agent-run
      - concept.agent-session
      - concept.workspace
      - concept.work-item
    owner: responsibility.run-supervisor
    trigger: The run's Workspace is ready and the pre-run hook has succeeded.
    preconditions:
      - The Workspace path has been verified as contained.
      - An agent runtime command is configured.
    sequence:
      - actor: responsibility.run-supervisor
        action: Ask the session client to start a session in the run's Workspace.
      - actor: responsibility.session-client
        action: Remove every configured credential-bearing variable from the agent environment.
      - actor: responsibility.session-client
        action: Start the agent runtime with the Workspace as its working directory.
      - actor: responsibility.session-client
        action: Apply the configured approval policy and sandbox policy to the session.
      - actor: responsibility.session-client
        action: Offer the configured provider-native tools to the session.
      - actor: responsibility.run-supervisor
        action: Render the prompt for this Turn and start the Turn.
      - actor: responsibility.session-client
        action: Forward each agent update to the scheduler with a timestamp.
      - actor: responsibility.session-client
        action: Answer approval requests when policy allows, otherwise end the turn as input-required.
      - actor: responsibility.session-client
        action: Execute agent tool calls and return their results to the agent.
      - actor: responsibility.run-supervisor
        action: End the session when the run ends, whatever the outcome.
    postconditions:
      - The agent process is no longer running when the run ends.
      - Every observed agent update has reached the scheduler.
      - The turn ended as completed, failed, or input-required.
    requirements:
      - level: must
        statement: Use the run's Workspace as the agent working directory.
      - level: must_not
        statement: Expose configured credential variables to the agent process.
      - level: must
        statement: Confine the agent's write access to its own Workspace by default.
      - level: must
        statement: End the agent session when the run ends.
      - level: must
        statement: Distinguish a turn that needs operator input from a turn that failed.
      - level: must
        statement: Abandon a turn that produces no agent activity within the silence timeout.
      - level: should
        statement: Report agent activity as it happens rather than only at turn end.
    invariants:
      - invariant.workspace-containment
      - invariant.agent-environment-excludes-credentials
    failures:
      - failure.session-start-failed
      - failure.turn-failed
    verification:
      - Start a session and verify the agent's working directory is the run workspace.
      - Configure a credential variable and verify it is absent from the agent process.
      - Point the session at a path outside the workspace root and verify it is refused.
      - Stop producing agent updates and verify the turn ends at the silence timeout.
      - Send an approval request under a restrictive policy and verify the turn ends as input-required.

  - id: interaction.continue-or-conclude-run
    name: Continue or Conclude the Run
    purpose: >
      Decide, after each completed Turn, whether the Work Item still warrants more
      agent effort inside the same run.
    participants:
      - responsibility.run-supervisor
      - responsibility.scheduler
      - concept.turn
      - concept.agent-session
      - concept.work-item
    owner: responsibility.run-supervisor
    trigger: A Turn completes normally.
    preconditions:
      - The Agent Session is still open.
      - The Work Item's identity is known.
    sequence:
      - actor: responsibility.run-supervisor
        action: Re-read the Work Item from the Work Source.
      - actor: responsibility.run-supervisor
        action: Conclude the run when the item is gone, non-active, or no longer routed.
      - actor: responsibility.run-supervisor
        action: Conclude the run when the configured turn budget for this run is exhausted.
      - actor: responsibility.run-supervisor
        action: Otherwise start another Turn that instructs the agent to resume, not restart.
      - actor: responsibility.scheduler
        action: Schedule a short follow-up check when the run concludes with the item still active.
    postconditions:
      - The run either continues with a further Turn or ends.
      - A run that ends with the item still active leaves the Claim in place.
    requirements:
      - level: must
        statement: Re-read the Work Item before starting another Turn.
      - level: must_not
        statement: Start another Turn once the configured turn budget is exhausted.
      - level: must
        statement: Return control to the scheduler when the turn budget is exhausted.
      - level: must
        statement: Tell a continuation Turn to resume from the existing workspace state.
      - level: must_not
        statement: Repeat the original task instructions in a continuation Turn.
    invariants:
      - invariant.turn-budget-bounded
    failures:
      - failure.turn-failed
    verification:
      - Keep an item active across turns and verify a further turn starts.
      - Exhaust the configured turn budget and verify control returns to the scheduler.
      - Remove a required label between turns and verify the run concludes.
      - Move the item out of the active states between turns and verify the run concludes.

  - id: interaction.reconcile-claimed-items
    name: Reconcile Claimed Work Items
    purpose: >
      Re-align every Claim with what the Work Source now says, so nothing keeps
      working on an item that no longer qualifies.
    participants:
      - responsibility.scheduler
      - responsibility.work-source-adapter
      - concept.work-source
      - concept.work-item
      - concept.claim
      - concept.agent-run
    owner: responsibility.scheduler
    trigger: A poll cycle begins.
    preconditions:
      - At least one Work Item is claimed, running, or blocked.
    sequence:
      - actor: responsibility.scheduler
        action: Read the current form of every claimed, running, and blocked Work Item.
      - actor: responsibility.work-source-adapter
        action: Return the requested items, omitting any that are no longer visible.
      - actor: responsibility.scheduler
        action: Stop the run and clean up the workspace for an item in a terminal state.
      - actor: responsibility.scheduler
        action: Stop the run and keep the workspace for an item that is no longer routed here.
      - actor: responsibility.scheduler
        action: Stop the run and keep the workspace for an item that left the active states.
      - actor: responsibility.scheduler
        action: Stop the run and keep the workspace for an item that is no longer visible.
      - actor: responsibility.scheduler
        action: Refresh the recorded form of items that still qualify.
      - actor: responsibility.scheduler
        action: Keep every Claim unchanged when the read itself failed.
    postconditions:
      - Every remaining Claim corresponds to an item that still qualifies.
      - Workspaces of items that reached a terminal state have been removed.
      - Workspaces of items that merely left the active set are preserved.
    requirements:
      - level: must
        statement: Release the Claim of an item that stopped qualifying.
      - level: must
        statement: Stop the active run before releasing its Claim.
      - level: must
        statement: Remove the workspace when the item reached a terminal state.
      - level: must_not
        statement: Remove the workspace when the item merely left the active states.
      - level: must
        statement: Apply the same reconciliation rules to blocked items.
      - level: must_not
        statement: Release any Claim when the reconciling read failed.
    invariants:
      - invariant.claim-follows-eligibility
    failures:
      - failure.work-source-unavailable
      - failure.work-item-disappeared
    verification:
      - Move a running item to a terminal state and verify the run stops and the workspace is removed.
      - Move a running item to a non-active state and verify the run stops and the workspace survives.
      - Remove a required label from a running item and verify the run stops.
      - Remove a required label from a blocked item and verify its claim is released.
      - Hide a running item from the work source and verify the run stops and the workspace survives.
      - Fail the reconciling read and verify every claim and run is retained.

  - id: interaction.retry-after-failure
    name: Retry After Failure
    purpose: >
      Turn any non-blocking failure into another attempt at a later time, with a
      delay that grows while failures repeat.
    participants:
      - responsibility.scheduler
      - concept.claim
      - concept.work-item
      - concept.agent-run
    owner: responsibility.scheduler
    trigger: An Agent Run ends without carrying its Work Item out of the active set.
    preconditions:
      - The Work Item is still claimed.
      - The run did not end because operator input is required.
    sequence:
      - actor: responsibility.scheduler
        action: Record the reason the run ended and the attempt number it reached.
      - actor: responsibility.scheduler
        action: Choose a short delay when the run completed normally and the item stays active.
      - actor: responsibility.scheduler
        action: Choose a growing, capped delay when the run ended abnormally.
      - actor: responsibility.scheduler
        action: Replace any pending retry for the item so only the newest one survives.
      - actor: responsibility.scheduler
        action: Wait for the delay while keeping the Claim.
      - actor: responsibility.scheduler
        action: Re-read the Work Item when the delay expires.
      - actor: responsibility.scheduler
        action: Release the Claim if the item no longer qualifies.
      - actor: responsibility.scheduler
        action: Start a new Agent Run if capacity allows, otherwise schedule a further retry.
    postconditions:
      - The item is running again, waiting for a further retry, or released.
      - At most one pending retry exists for the item.
    requirements:
      - level: must
        statement: Keep the Claim while a retry is pending.
      - level: must
        statement: Grow the delay as consecutive failures accumulate.
      - level: must
        statement: Cap the delay at the configured ceiling.
      - level: must
        statement: Re-read the Work Item before retrying it.
      - level: must
        statement: Ignore a retry signal that a newer retry has superseded.
      - level: should
        statement: Retry a normal completion sooner than a failure.
      - level: must
        statement: Report the failure reason with the pending retry.
    invariants:
      - invariant.retry-backoff-bounded
    failures:
      - failure.work-source-unavailable
    verification:
      - Fail a run repeatedly and verify each delay is at least as long as the previous one.
      - Fail a run many times and verify the delay never exceeds the configured ceiling.
      - Move the item to a terminal state during the delay and verify the claim is released.
      - Deliver a superseded retry signal and verify it does not start a run.
      - Fill all capacity at retry time and verify a further retry is scheduled.

  - id: interaction.detect-stalled-run
    name: Detect and Recover a Stalled Run
    purpose: >
      Reclaim capacity from a run whose agent has stopped reporting activity, without
      mistaking a run waiting for a human for a stalled one.
    participants:
      - responsibility.scheduler
      - concept.agent-run
      - concept.work-item
      - concept.agent-session
    owner: responsibility.scheduler
    trigger: A poll cycle begins and at least one run is active.
    preconditions:
      - A stall timeout is configured and enabled.
      - The run has a known time of last activity.
    sequence:
      - actor: responsibility.scheduler
        action: Compute how long each run has gone without agent activity.
      - actor: responsibility.scheduler
        action: Leave runs within the stall timeout untouched.
      - actor: responsibility.scheduler
        action: Block the item instead of restarting when the run is waiting for operator input.
      - actor: responsibility.scheduler
        action: Stop the run and schedule a retry with backoff otherwise.
    postconditions:
      - No run remains silent for longer than the configured timeout.
      - A stalled run has become either a pending retry or a blocked item.
    requirements:
      - level: must
        statement: Measure silence from the last observed agent activity.
      - level: must
        statement: Fall back to the run's start time when no activity was ever observed.
      - level: must_not
        statement: Restart a run that is waiting for operator input.
      - level: must
        statement: Allow the operator to disable stall detection.
      - level: must
        statement: Count a restarted stalled run as a further retry attempt.
    invariants:
      - invariant.retry-backoff-bounded
    failures:
      - failure.run-stalled
      - failure.operator-input-required
    verification:
      - Silence a run past the configured timeout and verify it is stopped and retried.
      - Silence a run that already requested operator input and verify it becomes blocked.
      - Disable stall detection and verify a silent run is left alone.

  - id: interaction.hold-blocked-item
    name: Hold a Work Item Blocked on Operator Input
    purpose: >
      Keep a Work Item and its Claim held, and make the pending human decision
      visible, instead of retrying work that cannot proceed.
    participants:
      - responsibility.scheduler
      - responsibility.observability-publisher
      - concept.work-item
      - concept.claim
      - concept.runtime-state
    owner: responsibility.scheduler
    trigger: A run ends or stalls while the agent is awaiting operator input, approval, or elicitation.
    preconditions:
      - The Work Item is claimed.
    sequence:
      - actor: responsibility.scheduler
        action: Stop the agent run without scheduling a retry.
      - actor: responsibility.scheduler
        action: Retain the Claim so nothing else picks the item up.
      - actor: responsibility.scheduler
        action: Record what the agent asked for and when it blocked.
      - actor: responsibility.observability-publisher
        action: Expose the item as blocked with that reason.
      - actor: responsibility.scheduler
        action: Release the block only when the item stops qualifying.
    postconditions:
      - The item holds a Claim, has no active run, and has no pending retry.
      - The reason for blocking is externally visible.
    requirements:
      - level: must_not
        statement: Schedule a retry for a blocked Work Item.
      - level: must
        statement: Retain the Claim for a blocked Work Item.
      - level: must
        statement: Expose the reason the item blocked.
      - level: must
        statement: Reconcile blocked items against the Work Source every cycle.
      - level: must
        statement: Release a blocked item that reaches a terminal state and remove its workspace.
      - level: should
        statement: Distinguish an approval request from a request for information.
    invariants:
      - invariant.blocked-item-not-retried
    failures:
      - failure.operator-input-required
    verification:
      - Make the agent request input and verify the item becomes blocked with no pending retry.
      - Verify a blocked item is not selected for dispatch while it stays blocked.
      - Move a blocked item to a terminal state and verify its claim and workspace are released.

  - id: interaction.release-claim-and-clean-up
    name: Release the Claim and Clean Up
    purpose: >
      End the subject's involvement with a Work Item and reclaim the resources its
      Claim was holding.
    participants:
      - responsibility.scheduler
      - responsibility.workspace-manager
      - concept.claim
      - concept.work-item
      - concept.workspace
    owner: responsibility.scheduler
    trigger: A claimed Work Item reaches a terminal state, leaves the active states, or stops being visible.
    preconditions:
      - The Work Item is claimed.
    sequence:
      - actor: responsibility.scheduler
        action: Stop any active run for the item.
      - actor: responsibility.scheduler
        action: Cancel any pending retry for the item.
      - actor: responsibility.scheduler
        action: Clear any blocked record for the item.
      - actor: responsibility.workspace-manager
        action: Remove the item's workspace when the item reached a terminal state.
      - actor: responsibility.workspace-manager
        action: Run the removal hook before deleting a workspace, ignoring its failure.
      - actor: responsibility.scheduler
        action: Drop the Claim.
    postconditions:
      - The item holds no Claim, run, retry, or blocked record.
      - A terminal item's workspace no longer exists.
    requirements:
      - level: must
        statement: Remove a workspace only through a path proven inside the configured root.
      - level: must
        statement: Run the removal hook before deleting workspace content.
      - level: must
        statement: Continue removal when the removal hook fails or times out.
      - level: must
        statement: Reclaim workspaces of items already terminal when the subject starts.
      - level: must
        statement: Prefer the workspace recorded for the run over a re-derived path.
    invariants:
      - invariant.workspace-containment
      - invariant.claim-follows-eligibility
    failures:
      - failure.hook-failed
    verification:
      - Close an item with a running agent and verify the run stops and the workspace is removed.
      - Fail the removal hook and verify the workspace is still removed.
      - Point a recorded workspace path at an escaping link and verify removal is refused.
      - Start the subject with terminal items present and verify their workspaces are reclaimed.

  - id: interaction.load-and-reload-configuration
    name: Load and Reload the Workflow Definition
    purpose: >
      Make the operator's declaration effective, keep it current while running, and
      never let an invalid edit degrade a healthy deployment.
    participants:
      - responsibility.configuration-store
      - responsibility.scheduler
      - concept.workflow-definition
      - concept.work-source
    owner: responsibility.configuration-store
    trigger: The subject starts, or the Workflow Definition changes while it runs.
    preconditions:
      - A Workflow Definition location is known.
    sequence:
      - actor: responsibility.configuration-store
        action: Read the Workflow Definition and separate its settings from its prompt.
      - actor: responsibility.configuration-store
        action: Apply defaults for every omitted setting.
      - actor: responsibility.configuration-store
        action: Validate the settings, including the selected work source's own requirements.
      - actor: responsibility.configuration-store
        action: Refuse to start when the first load is invalid.
      - actor: responsibility.configuration-store
        action: Make a valid definition effective and remember it as last known good.
      - actor: responsibility.configuration-store
        action: Keep the last known good definition and report the error when a reload is invalid.
      - actor: responsibility.scheduler
        action: Apply the effective settings from the start of the next decision.
    postconditions:
      - Exactly one valid Workflow Definition is effective.
      - An invalid edit has changed no behavior.
    requirements:
      - level: must
        statement: Refuse to start when no valid Workflow Definition is available.
      - level: must_not
        statement: Make an invalid Workflow Definition effective.
      - level: must
        statement: Keep running on the last valid definition after a failed reload.
      - level: must
        statement: Report every reload failure to the operator.
      - level: must
        statement: Detect changes without requiring a restart.
      - level: must
        statement: Resolve credential references from the environment rather than storing secrets inline.
      - level: should
        statement: Apply a changed limit from the next decision, not retroactively.
    invariants:
      - invariant.last-known-good-configuration
    failures:
      - failure.invalid-configuration
    verification:
      - Start with an invalid definition and verify the subject does not start.
      - Make a valid definition invalid while running and verify prior settings stay effective.
      - Make a valid definition invalid while running and verify the failure is reported.
      - Change a limit while running and verify later decisions use the new value.

  - id: interaction.publish-runtime-state
    name: Publish Runtime State
    purpose: >
      Give operators a current, self-explaining picture of what the subject is doing
      and what each run has consumed.
    participants:
      - responsibility.observability-publisher
      - responsibility.scheduler
      - concept.runtime-state
      - concept.agent-run
      - concept.work-item
    owner: responsibility.observability-publisher
    trigger: Orchestration state changes, or a reader requests the current state.
    preconditions:
      - The scheduler is reachable.
    sequence:
      - actor: responsibility.scheduler
        action: Expose a consistent snapshot of running, retrying, and blocked items.
      - actor: responsibility.observability-publisher
        action: Fold each reported usage figure into the run's totals without double counting.
      - actor: responsibility.observability-publisher
        action: Project the snapshot with the reason for every retry and every block.
      - actor: responsibility.observability-publisher
        action: Report when the next poll is due and whether a poll is in progress.
      - actor: responsibility.observability-publisher
        action: Report that state is unavailable rather than block when the scheduler does not answer.
      - actor: responsibility.scheduler
        action: Honor an operator request to poll sooner, coalescing repeats.
    postconditions:
      - A reader can tell running, retrying, and blocked items apart.
      - A reader can see why each retrying or blocked item is in that state.
    requirements:
      - level: must
        statement: Distinguish running, retrying, and blocked items.
      - level: must
        statement: Report the reason for every retry and every block.
      - level: must_not
        statement: Delay or block scheduling in order to publish state.
      - level: must
        statement: Report unavailability instead of waiting indefinitely for a snapshot.
      - level: must
        statement: Coalesce repeated immediate-poll requests into one cycle.
      - level: should
        statement: Report the workspace and execution location of every run.
    invariants:
      - invariant.token-totals-monotonic
    failures:
      - failure.work-source-unavailable
    verification:
      - Run, retry, and block one item each, then verify all three are distinguishable.
      - Stop answering snapshot requests and verify the reader is told state is unavailable.
      - Request an immediate poll twice in quick succession and verify one cycle results.
      - Report a smaller cumulative usage figure and verify the run's totals do not decrease.

  - id: interaction.run-on-remote-worker
    name: Run on a Remote Worker Host
    conformance: extension
    purpose: >
      Spread Agent Runs across several execution locations while keeping each run
      whole on the location it started on.
    participants:
      - responsibility.scheduler
      - responsibility.run-supervisor
      - concept.worker-host
      - concept.agent-run
      - concept.workspace
      - concept.work-item
    owner: responsibility.scheduler
    trigger: A run is about to start and more than one execution location is configured.
    preconditions:
      - At least one remote worker host is configured.
      - The workspace root is meaningful on the selected host.
    sequence:
      - actor: responsibility.scheduler
        action: Exclude hosts that already carry their configured share of runs.
      - actor: responsibility.scheduler
        action: Defer the dispatch when no host has capacity.
      - actor: responsibility.scheduler
        action: Prefer the host a retrying run previously used, when it still has capacity.
      - actor: responsibility.scheduler
        action: Otherwise choose the least loaded host, breaking ties deterministically.
      - actor: responsibility.run-supervisor
        action: Prepare the workspace and run the session on the chosen host.
      - actor: responsibility.run-supervisor
        action: Report the failure to the scheduler rather than move the run to another host.
    postconditions:
      - The run's workspace and session are on the same host.
      - No host exceeds its configured share of concurrent runs.
    requirements:
      - level: must
        statement: Keep one run's workspace and session on the same host.
      - level: must_not
        statement: Move a running run to a different host after a failure.
      - level: must
        statement: Defer dispatch when every host is at its configured share.
      - level: should
        statement: Return a retrying run to the host that already holds its workspace.
      - level: must
        statement: Apply the workspace containment rules on the remote host too.
    invariants:
      - invariant.run-does-not-hop-hosts
      - invariant.concurrency-limits-respected
    failures:
      - failure.worker-host-unreachable
    verification:
      - Fill every host to its configured share and verify dispatch is deferred.
      - Fail a run on one host and verify the retry does not start on another host.
      - Retry a run whose host still has capacity and verify the same host is chosen.
      - Make one host unreachable and verify the failure surfaces as a normal run failure.

  - id: interaction.execute-agent-tool
    name: Execute a Provider-Native Agent Tool
    conformance: extension
    purpose: >
      Let the agent act on the board through the subject's credential, instead of
      giving the agent that credential.
    participants:
      - responsibility.session-client
      - responsibility.work-source-adapter
      - concept.agent-session
      - concept.agent-tool
      - concept.work-item
    owner: responsibility.work-source-adapter
    trigger: The agent calls a tool the adapter advertised for this session.
    preconditions:
      - The session was started with the adapter's tool advertisement.
      - A credential for the work source is configured.
    sequence:
      - actor: responsibility.session-client
        action: Receive the tool call and its arguments from the agent.
      - actor: responsibility.work-source-adapter
        action: Reject arguments that do not satisfy the tool's declared shape.
      - actor: responsibility.work-source-adapter
        action: Execute the call with the credential and settings bound when the session started.
      - actor: responsibility.session-client
        action: Return a structured result stating success or failure to the agent.
      - actor: responsibility.session-client
        action: Return a failure result naming the supported tools when the tool is unknown.
    postconditions:
      - The agent has a structured result for every call it made.
      - The agent never received the credential itself.
    requirements:
      - level: must
        statement: Execute tool calls outside the agent process.
      - level: must
        statement: Bind tool settings when the session starts, not when the call arrives.
      - level: must
        statement: Return a structured failure rather than raising on a bad call.
      - level: must_not
        statement: Add retry, deduplication, or rate-limit policy on the agent's behalf.
      - level: must
        statement: State that tool reach follows the credential, not the scheduler's scope.
    invariants:
      - invariant.agent-environment-excludes-credentials
    failures:
      - failure.agent-tool-failed
    verification:
      - Call an advertised tool and verify it runs with the session-bound settings.
      - Change the effective settings mid-session and verify the bound settings are still used.
      - Call an unknown tool and verify a failure result naming supported tools is returned.
      - Call a tool with malformed arguments and verify a structured failure is returned.

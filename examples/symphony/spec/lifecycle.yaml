# Lifecycle of one Claim over a Work Item, from the subject's point of view.
# It is not the tracker's own workflow, which the subject only reads.
initial_state: state.eligible
terminal_states:
  - state.released
states:
  - id: state.eligible
    name: Eligible
    meaning: >
      The Work Item qualifies for orchestration but the subject holds no Claim on it.
  - id: state.running
    name: Running
    meaning: >
      The subject holds a Claim and an Agent Run is active for the item.
  - id: state.retry-waiting
    name: Retry Waiting
    meaning: >
      The subject holds a Claim, no run is active, and a further attempt is scheduled.
  - id: state.blocked
    name: Blocked
    meaning: >
      The subject holds a Claim, no run is active, and the item awaits an operator decision.
  - id: state.released
    name: Released
    meaning: >
      The subject holds no Claim. The item may become Eligible again as a fresh Claim.
transitions:
  - from: state.eligible
    to: state.running
    trigger: The item is selected, revalidated, and an Agent Run starts for it.
  - from: state.running
    to: state.retry-waiting
    trigger: The run ends without carrying the item out of the active states.
  - from: state.running
    to: state.blocked
    trigger: The run ends or stalls while the agent awaits an operator decision.
  - from: state.running
    to: state.released
    trigger: The item reaches a terminal state, leaves the active states, stops being routed here, or stops being visible.
  - from: state.retry-waiting
    to: state.running
    trigger: The delay expires, the item still qualifies, and capacity is available.
  - from: state.retry-waiting
    to: state.retry-waiting
    trigger: The delay expires but capacity is unavailable or the revalidating read fails.
  - from: state.retry-waiting
    to: state.released
    trigger: The item stops qualifying while the delay is pending.
  - from: state.blocked
    to: state.released
    trigger: The item stops qualifying, or the subject restarts and forgets the block.
normative:
  - A Work Item MUST NOT be in more than one of these states at a time.
  - Running, Retry Waiting, and Blocked all hold the Claim.
  - Only the Released state permits a new Claim on the same item.
  - Every transition out of Running MUST first stop the active run.
  - A Blocked item MUST NOT transition directly to Retry Waiting.
  - Losing the Claim record MUST make the item Eligible, never leave it orphaned.

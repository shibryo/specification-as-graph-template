specification:
  name: Symphony
  version: 0.1.0
  status: draft
  stance: recovered
  summary: >
    Symphony turns work items on a tracker board into isolated, autonomous coding-agent
    runs. It decides which items deserve an agent, gives each run its own workspace,
    keeps the run going until the item leaves the active set, and surfaces progress,
    cost, and blockage to operators.

normative_language:
  must: required for conformance
  must_not: prohibited for conformance
  should: expected unless there is a justified reason to deviate
  should_not: normally avoided unless justified
  may: optional
  implementation_defined: variable within constraints stated by this specification
  unspecified: consumers must not rely on the behavior

entrypoints:
  - intent.yaml
  - model.yaml
  - responsibilities.yaml
  - parameters.yaml
  - chapters.yaml
  - interactions.yaml
  - lifecycle.yaml
  - interfaces.yaml
  - invariants.yaml
  - failures.yaml
  - implementation-defined.yaml
  - reference.yaml

implementation_instruction: >
  Implement a conforming realization of this specification. Preserve the normative
  semantics and the design intent. Do not infer additional constraints from the
  reference implementation. Where behavior is implementation-defined, choose a
  reasonable mechanism that preserves all stated invariants.

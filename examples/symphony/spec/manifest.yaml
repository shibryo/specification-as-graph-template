specification:
  name: Symphony Issue-Driven Agent Orchestrator
  version: 0.1.0
  status: draft
  stance: recovered
  summary: >
    A long-running orchestration service that polls an issue tracker, claims
    eligible work items, provisions isolated per-issue workspaces, and
    supervises autonomous coding-agent sessions until each item leaves its
    active tracker states. Recovered from the reference Elixir implementation.

normative_language:
  must: required for conformance
  must_not: prohibited for conformance
  should: expected unless there is a justified reason to deviate
  should_not: normally avoided unless justified
  may: optional
  implementation_defined: variable within constraints stated by this specification
  unspecified: consumers must not rely on the behavior

entrypoints:
  - intent.yaml
  - model.yaml
  - responsibilities.yaml
  - parameters.yaml
  - chapters.yaml
  - interactions.yaml
  - lifecycle.yaml
  - interfaces.yaml
  - invariants.yaml
  - failures.yaml
  - implementation-defined.yaml
  - evidence.yaml
  - reference.yaml

implementation_instruction: >
  Implement a conforming realization of this specification. Preserve normative
  semantics and design intent. Do not infer additional constraints from the
  reference implementation. Where behavior is implementation-defined, choose a
  reasonable mechanism that preserves all stated invariants, and document it.

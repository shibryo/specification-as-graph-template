overview: >
  A Work Source holds Work Items. The scheduler polls it, picks the items that
  currently qualify, and takes a Claim on each one. A Claim funds one Agent Run: an
  isolated Workspace on a Worker Host, and an Agent Session inside it that advances
  the item across one or more Turns. A Workflow Definition supplies the policy, the
  prompt, and the operator's tunable settings for all of this. While runs proceed,
  the subject re-reads the Work Source and releases claims for items that stopped
  qualifying, retries runs that failed, and holds runs that are waiting for a human.
  Runtime State exposes all of that to operators.

external_dependencies:
  - A work source that can be read by state and by item identity.
  - A coding agent runtime that accepts a prompt and reports progress.
  - Credentials for the work source, held by the operator, not by the agent.
  - Storage for isolated per-item workspaces.

concepts:
  - id: concept.work-item
    name: Work Item
    meaning: >
      A unit of work on the board that the subject may hand to an agent. It is the
      unit of claiming, of workspace identity, and of reporting.
    attributes:
      - name: id
        type: string
        required: true
        meaning: Stable dispatch identity within the configured work source scope.
      - name: identifier
        type: string
        required: true
        meaning: Human-readable key. Unique in scope. Derives the workspace identity.
      - name: title
        type: string
        required: true
        meaning: Short description of the work. Supplied to the agent.
      - name: description
        type: string
        required: false
        meaning: Long-form statement of the work. Supplied to the agent.
      - name: state
        type: string
        required: true
        meaning: Current board state. Compared against configured active and terminal states.
      - name: labels
        type: list of string
        required: false
        meaning: Routing labels. Compared case-insensitively after trimming.
      - name: priority
        type: integer
        required: false
        meaning: Dispatch precedence. Lower values are dispatched first.
      - name: created_at
        type: timestamp
        required: false
        meaning: Creation time. Breaks ties between items of equal priority. Oldest first.
      - name: blocked_by
        type: list of reference
        required: false
        meaning: Other items that must reach a terminal state first.
      - name: assignee
        type: string
        required: false
        meaning: Routing target. Used when the deployment routes work to a specific worker.
      - name: dispatchable
        type: boolean
        required: true
        meaning: Adapter's verdict on provider-level readiness. Never the whole decision.
      - name: url
        type: string
        required: false
        meaning: Location of the item for an operator. Informational only.
    properties:
      - A Work Item missing any required field MUST NOT be dispatched.
      - The identifier MUST be stable for the life of the item.
      - Item state is read from the Work Source. The subject never writes it.

  - id: concept.work-source
    name: Work Source
    meaning: >
      The system of record for Work Items. It is read by state and by item identity.
      It is never written by the scheduler.
    properties:
      - The Work Source is authoritative about whether an item still qualifies.
      - Reads are scoped to one configured collection of work.
      - A read failure is a transient condition, not a signal that work ended.

  - id: concept.workflow-definition
    name: Workflow Definition
    meaning: >
      The operator's declaration of how work is orchestrated. It carries the
      configuration and the prompt template given to the agent.
    properties:
      - It is the single operator-facing contract for runtime behavior.
      - It is re-read while the subject runs.
      - A version that fails validation never becomes effective.

  - id: concept.claim
    name: Claim
    meaning: >
      The subject's exclusive hold on a Work Item. A Claim exists from the moment an
      item is selected until the item stops qualifying for orchestration.
    properties:
      - At most one Claim exists per Work Item.
      - A Claim survives run failure, retry waiting, and blocking.
      - Releasing a Claim makes the item selectable again on a later cycle.

  - id: concept.agent-run
    name: Agent Run
    meaning: >
      One supervised attempt to advance a claimed Work Item. It owns a Workspace and
      an Agent Session for its lifetime.
    attributes:
      - name: attempt
        type: integer
        required: false
        meaning: Position in the retry sequence for this Claim. Absent on a first attempt.
      - name: worker_host
        type: reference
        required: false
        meaning: Execution location chosen for this run. Fixed for the run's lifetime.
    properties:
      - A run ends when the agent stops, the item stops qualifying, or the run is preempted.
      - A run's outcome selects the next lifecycle state of the Claim.

  - id: concept.workspace
    name: Workspace
    meaning: >
      An isolated working directory that belongs to one Work Item. The agent's
      working directory for the whole run.
    properties:
      - Its identity is derived deterministically from the Work Item identifier.
      - It MUST resolve inside the configured workspace root.
      - It MUST NOT be the workspace root itself.
      - Existing content is reused across runs for the same item unless removed.

  - id: concept.agent-session
    name: Agent Session
    meaning: >
      A live conversation with the coding agent, bound to one Workspace and one Work
      Item. It carries the agent's policy settings and its stream of updates.
    properties:
      - A session belongs to exactly one Agent Run.
      - A session ends when its run ends.
      - Session updates are the only evidence the subject has of agent progress.

  - id: concept.turn
    name: Turn
    meaning: >
      One prompt-to-completion exchange inside an Agent Session. A run may need more
      than one turn to carry an item to a non-active state.
    properties:
      - The first turn carries the rendered work prompt.
      - A later turn tells the agent to resume rather than restart.
      - The number of turns in one run is bounded by configuration.

  - id: concept.worker-host
    name: Worker Host
    meaning: >
      An execution location where a Workspace lives and an Agent Session runs. A
      deployment always has at least the local location.
    properties:
      - A run stays on the host chosen for it.
      - Workspaces on different hosts are independent.

  - id: concept.runtime-state
    name: Runtime State
    meaning: >
      The externally observable picture of orchestration right now: which items are
      running, retrying, or blocked, what each has consumed, and when the next poll
      is due.
    properties:
      - It is derived from the scheduler's live state.
      - It reports the reason an item is retrying or blocked.
      - It is read-only except for an explicit request to poll sooner.

  - id: concept.agent-tool
    name: Provider-Native Agent Tool
    conformance: extension
    meaning: >
      A capability the Work Source adapter offers to the agent so the agent can act
      on the board without holding its own credential.
    properties:
      - The tool is executed by the subject, not by the agent process.
      - The tool is bound to the settings in effect when the session started.
      - Tool reach is limited by the configured credential, not by scheduler scope.

relationships:
  - subject: concept.work-source
    relation: supplies
    object: concept.work-item
    meaning: >
      The Work Source is read by state and by identity. Everything the scheduler
      knows about an item comes from that read.

  - subject: concept.claim
    relation: holds
    object: concept.work-item
    meaning: >
      A Claim marks an item as owned by this subject. No second run may start for a
      claimed item.

  - subject: concept.agent-run
    relation: advances
    object: concept.work-item
    meaning: >
      A run exists to move the item out of the active set. The item's state after
      the run decides whether another run follows.

  - subject: concept.agent-run
    relation: occupies
    object: concept.workspace
    meaning: >
      A run works inside exactly one Workspace, which persists between runs for the
      same item unless the item is released.

  - subject: concept.agent-run
    relation: drives
    object: concept.agent-session
    meaning: >
      A run starts one session, runs turns in it, and ends the session when the run
      ends.

  - subject: concept.agent-session
    relation: is_composed_of
    object: concept.turn
    meaning: >
      A session carries one or more turns. Later turns continue the same context
      rather than starting over.

  - subject: concept.workspace
    relation: resides_on
    object: concept.worker-host
    meaning: >
      A Workspace exists at one execution location. Containment rules apply at that
      location.

  - subject: concept.workflow-definition
    relation: configures
    object: concept.agent-run
    meaning: >
      The definition supplies the prompt, the agent policy, the hooks, and the limits
      that shape every run.

  - subject: concept.workflow-definition
    relation: selects
    object: concept.work-source
    meaning: >
      The definition names which work source is read and which states, labels, and
      scope qualify an item.

  - subject: concept.runtime-state
    relation: reports
    object: concept.agent-run
    meaning: >
      Runtime State projects each run's location, session, progress, cost, and last
      known event.

  - subject: concept.agent-session
    relation: may_invoke
    object: concept.agent-tool
    meaning: >
      A session may call a provider-native tool. The subject executes the call and
      returns the result to the agent.

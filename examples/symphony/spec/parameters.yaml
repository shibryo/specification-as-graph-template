parameters:
  - id: parameter.work-source-selection
    name: Work source selection
    key: work-source.selection
    controls: >
      Which Work Source is read and which collection of work is in scope.
    semantics:
      - Exactly one work source is effective at a time.
      - Its scope bounds every read the scheduler makes.
      - The subject does not start when the selection is absent or unsupported.
      - Provider-specific settings belong to the selected source, not to the scheduler.
    reload: >
      A change takes effect from the next poll cycle. Runs already started are
      unaffected until they are reconciled.
    constrains:
      - interaction.poll-and-dispatch
      - interaction.reconcile-claimed-items
      - interface.work-source-adapter

  - id: parameter.work-source-credential
    name: Work source credential
    key: work-source.credential
    controls: >
      The secret the subject presents when reading the Work Source and executing
      provider-native tools.
    semantics:
      - The credential may be supplied indirectly through the environment.
      - Every environment name that carries it is declared so it can be withheld from the agent.
      - An absent credential is a configuration failure, not a read failure.
    reload: >
      A change takes effect on the next read. Sessions keep the credential bound when
      they started.
    constrains:
      - interaction.poll-and-dispatch
      - interaction.run-agent-session
      - invariant.agent-environment-excludes-credentials

  - id: parameter.active-states
    name: Active states
    key: scheduling.active-states
    controls: >
      Which board states make a Work Item eligible for an Agent Run.
    semantics:
      - Only items in an active state are selected for dispatch.
      - A claimed item that leaves the active states is released.
      - A run whose item leaves the active states stops starting further turns.
      - Matching ignores case and surrounding whitespace.
    reload: >
      A change takes effect from the next poll cycle and applies to existing claims
      at the next reconciliation.
    constrains:
      - interaction.poll-and-dispatch
      - interaction.reconcile-claimed-items
      - interaction.continue-or-conclude-run

  - id: parameter.terminal-states
    name: Terminal states
    key: scheduling.terminal-states
    controls: >
      Which board states mean the work is over and its workspace may be reclaimed.
    semantics:
      - An item in a terminal state is never dispatched.
      - A claimed item reaching a terminal state has its run stopped and workspace removed.
      - "Terminal is stronger than non-active: only terminal removes the workspace."
      - Items already terminal at startup have their workspaces reclaimed.
    reload: >
      A change takes effect from the next poll cycle.
    constrains:
      - interaction.reconcile-claimed-items
      - interaction.release-claim-and-clean-up
      - interaction.poll-and-dispatch

  - id: parameter.required-labels
    name: Required labels
    key: scheduling.required-labels
    controls: >
      Which labels a Work Item must carry before this deployment will work on it.
    semantics:
      - An item must carry every configured label to be dispatched.
      - An item that loses a required label has its run stopped and its claim released.
      - Matching ignores case and surrounding whitespace.
      - An empty list imposes no label requirement.
      - A blank configured label matches no item.
    reload: >
      A change takes effect from the next poll cycle and applies to existing claims
      at the next reconciliation.
    constrains:
      - interaction.poll-and-dispatch
      - interaction.reconcile-claimed-items
      - invariant.claim-follows-eligibility

  - id: parameter.poll-interval
    name: Poll interval
    key: scheduling.poll-interval
    controls: >
      How long the scheduler waits between poll cycles.
    semantics:
      - It bounds how quickly new work is noticed.
      - It bounds how quickly a claim reacts to a board change.
      - An operator may request an earlier cycle without changing the interval.
      - The value must be positive.
    reload: >
      A change takes effect when the next cycle is scheduled.
    constrains:
      - interaction.poll-and-dispatch
      - interaction.reconcile-claimed-items

  - id: parameter.max-concurrent-runs
    name: Maximum concurrent runs
    key: capacity.max-concurrent-runs
    controls: >
      How many Agent Runs may be active at once across the whole deployment.
    semantics:
      - Dispatch stops when the limit is reached and resumes when a run ends.
      - Items deferred by the limit stay eligible for a later cycle.
      - A retry is subject to the same limit as a first dispatch.
      - The value must be positive.
    reload: >
      A change takes effect from the next dispatch decision. Runs already active are
      not stopped to satisfy a lowered limit.
    constrains:
      - interaction.poll-and-dispatch
      - invariant.concurrency-limits-respected

  - id: parameter.max-concurrent-runs-by-state
    name: Maximum concurrent runs per board state
    key: capacity.max-concurrent-runs-by-state
    controls: >
      How many Agent Runs may be active at once for Work Items in a given board state.
    semantics:
      - A state without an entry falls back to the global limit.
      - Both the per-state limit and the global limit must permit a dispatch.
      - State names are matched case-insensitively after trimming.
      - Each configured limit must be a positive integer.
    reload: >
      A change takes effect from the next dispatch decision.
    constrains:
      - interaction.poll-and-dispatch
      - invariant.concurrency-limits-respected

  - id: parameter.max-turns-per-run
    name: Maximum turns per run
    key: capacity.max-turns-per-run
    controls: >
      How many Turns one Agent Run may start while its Work Item stays active.
    semantics:
      - The run ends when the budget is exhausted, even if the item is still active.
      - Ending on an exhausted budget returns control to the scheduler with the claim held.
      - The value must be positive.
    reload: >
      A change takes effect for runs that start afterwards.
    constrains:
      - interaction.continue-or-conclude-run
      - invariant.turn-budget-bounded

  - id: parameter.max-retry-delay
    name: Maximum retry delay
    key: recovery.max-retry-delay
    controls: >
      The ceiling on the growing delay between attempts for one Claim.
    semantics:
      - The delay grows with consecutive failures and never exceeds this ceiling.
      - The ceiling bounds how long recovery can take after a transient failure.
      - The value must be positive.
    reload: >
      A change takes effect when the next retry is scheduled.
    constrains:
      - interaction.retry-after-failure
      - invariant.retry-backoff-bounded

  - id: parameter.stall-timeout
    name: Stall timeout
    key: recovery.stall-timeout
    controls: >
      How long a run may go without observable agent activity before it is restarted.
    semantics:
      - Silence is measured from the last observed agent activity.
      - A run with no activity yet is measured from when it started.
      - A run awaiting operator input is blocked rather than restarted.
      - A value of zero disables stall detection entirely.
    reload: >
      A change takes effect at the next poll cycle.
    constrains:
      - interaction.detect-stalled-run
      - failure.run-stalled

  - id: parameter.workspace-root
    name: Workspace root
    key: workspace.root
    controls: >
      The directory beneath which every Workspace must live.
    semantics:
      - Every workspace path is verified to resolve inside this root.
      - The root itself is never used as a workspace and never removed.
      - A relative value resolves against the Workflow Definition's own location.
      - The value may be supplied indirectly through the environment.
    reload: >
      A change takes effect for workspaces prepared afterwards. Existing workspaces
      are not moved.
    constrains:
      - interaction.prepare-workspace
      - invariant.workspace-containment

  - id: parameter.workspace-hooks
    name: Workspace lifecycle hooks
    key: workspace.hooks
    controls: >
      Operator-supplied commands run at workspace creation, before a run, after a
      run, and before removal.
    semantics:
      - Each hook runs with the Workspace as its working directory.
      - The creation hook runs only on the run that created the directory.
      - Creation and pre-run hook failures fail the run.
      - Post-run and removal hook failures are advisory.
      - Every hook is bounded by the hook timeout.
    reload: >
      A change takes effect at the next hook invocation.
    constrains:
      - interaction.prepare-workspace
      - interaction.release-claim-and-clean-up
      - interface.workspace-hooks

  - id: parameter.hook-timeout
    name: Hook timeout
    key: workspace.hook-timeout
    controls: >
      How long any single hook may run before it is abandoned.
    semantics:
      - A hook exceeding the timeout is abandoned and treated as failed.
      - The timeout applies to every hook, local or remote.
      - The value must be positive.
    reload: >
      A change takes effect at the next hook invocation.
    constrains:
      - interface.workspace-hooks
      - failure.hook-failed

  - id: parameter.agent-command
    name: Agent runtime command
    key: agent.command
    controls: >
      Which agent runtime is launched for an Agent Session and how it is invoked.
    semantics:
      - The runtime is launched with the run's Workspace as its working directory.
      - The value must be present and non-blank.
      - The launched runtime must speak the session protocol the subject expects.
    reload: >
      A change takes effect for sessions started afterwards.
    constrains:
      - interaction.run-agent-session
      - interface.agent-session

  - id: parameter.agent-prompt
    name: Work prompt template
    key: agent.prompt-template
    controls: >
      What the agent is told about the Work Item at the start of a run.
    semantics:
      - The template may reference Work Item fields and the attempt number.
      - An empty template selects a built-in default.
      - A template that cannot be parsed fails the run.
      - A continuation turn's instruction is not drawn from this template.
    reload: >
      A change takes effect for prompts rendered afterwards.
    constrains:
      - interface.prompt-template
      - interaction.run-agent-session

  - id: parameter.agent-approval-policy
    name: Agent approval policy
    key: agent.approval-policy
    controls: >
      Which agent requests the subject may answer on the operator's behalf.
    semantics:
      - A restrictive policy causes an unanswerable request to block the item.
      - A permissive policy lets the subject answer approvals and continue the turn.
      - The default is restrictive, so unattended approval is opt-in.
    reload: >
      A change takes effect for sessions started afterwards.
    constrains:
      - interaction.run-agent-session
      - interaction.hold-blocked-item

  - id: parameter.agent-sandbox-policy
    name: Agent sandbox policy
    key: agent.sandbox-policy
    controls: >
      What the agent may read, write, and reach while a Turn runs.
    semantics:
      - The default confines writes to the run's Workspace.
      - Network access is off by default and enabled deliberately.
      - An explicitly configured policy is passed to the runtime unchanged.
      - A policy that permits writes outside the Workspace violates containment.
    reload: >
      A change takes effect for sessions started afterwards.
    constrains:
      - interaction.run-agent-session
      - invariant.workspace-containment

  - id: parameter.turn-silence-timeout
    name: Turn silence timeout
    key: agent.turn-silence-timeout
    controls: >
      How long one Turn may go without any agent message before it is abandoned.
    semantics:
      - Each agent message resets the interval.
      - The timeout is not a cap on the total length of a Turn.
      - The value must be positive.
    reload: >
      A change takes effect for turns started afterwards.
    constrains:
      - interface.agent-session
      - failure.turn-failed

  - id: parameter.protocol-read-timeout
    name: Session startup response timeout
    key: agent.startup-response-timeout
    controls: >
      How long the subject waits for the agent runtime to answer a startup exchange.
    semantics:
      - Exceeding it fails the session start rather than the whole subject.
      - It is distinct from the timeout that governs turn silence.
      - The value must be positive.
    reload: >
      A change takes effect for sessions started afterwards.
    constrains:
      - interaction.run-agent-session
      - failure.session-start-failed

  - id: parameter.observability-exposure
    name: Runtime state exposure
    key: observability.exposure
    controls: >
      Whether and how the Runtime State is presented to operators.
    semantics:
      - Runtime State is always derivable, whatever presentation is configured.
      - Presentation cadence is operator-settable.
      - Presentation must not delay scheduling.
    reload: >
      A change takes effect at the next presentation cycle.
    constrains:
      - interaction.publish-runtime-state
      - interface.runtime-state

  - id: parameter.worker-hosts
    name: Remote worker hosts
    key: workers.hosts
    conformance: extension
    controls: >
      Which remote execution locations may carry Agent Runs.
    semantics:
      - An empty list means every run executes locally.
      - A configured list makes every run execute on one of those locations.
      - A run stays on the location chosen for it.
      - The workspace root is interpreted on the chosen location.
    reload: >
      A change takes effect for runs dispatched afterwards. Running runs stay where
      they are.
    constrains:
      - interaction.run-on-remote-worker
      - invariant.run-does-not-hop-hosts

  - id: parameter.max-runs-per-host
    name: Maximum concurrent runs per host
    key: workers.max-runs-per-host
    conformance: extension
    controls: >
      How many Agent Runs one execution location may carry at once.
    semantics:
      - Dispatch is deferred when every configured location is at its share.
      - The global limit still applies on top of the per-location share.
      - An absent value imposes no per-location share.
      - A configured value must be positive.
    reload: >
      A change takes effect from the next dispatch decision.
    constrains:
      - interaction.run-on-remote-worker
      - invariant.concurrency-limits-respected

  - id: parameter.observability-service
    name: Observability service endpoint
    key: observability.service-endpoint
    conformance: extension
    controls: >
      Whether the Runtime State is served over a network, and where it listens.
    semantics:
      - The service does not run unless an endpoint is configured.
      - The bind address defaults to a loopback address.
      - Enabling the service changes no scheduling behavior.
    reload: >
      A change takes effect when the service is next started.
    constrains:
      - interface.observability-service
      - interaction.publish-runtime-state

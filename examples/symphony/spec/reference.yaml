reference_implementation:
  normative: false
  anchor:
    repository: https://github.com/openai/symphony
    revision: 8001b52
    subtree: elixir/
    note: >
      All evidence-register source locations are relative to this repository at this
      revision. The recovery read the implementation, its tests, and its own
      documentation. It did not read any prior specification of this subject.
  summary: >
    The reference implementation is an Elixir/OTP service that polls an issue tracker,
    creates a workspace per issue, launches a Codex app-server session inside it, and
    keeps that session working until the issue leaves the active set. It is one
    realization of this specification and adds no normative requirements.
  mapping:
    - responsibility: responsibility.scheduler
      realization: A single supervised GenServer holding claims, retries, and blocked entries in memory.
    - responsibility: responsibility.run-supervisor
      realization: A supervised task per issue that owns workspace, session, and turn loop.
    - responsibility: responsibility.workspace-manager
      realization: A module that canonicalizes paths before creating, using, or deleting them.
    - responsibility: responsibility.configuration-store
      realization: A store that re-reads the workflow document and keeps the last valid settings.
    - responsibility: responsibility.work-source-adapter
      realization: A behaviour with adapters for several hosted trackers and an in-memory one.
    - responsibility: responsibility.session-client
      realization: A JSON-RPC client speaking to the agent runtime over its standard streams.
    - responsibility: responsibility.observability-publisher
      realization: A terminal dashboard plus an optional web service over the same snapshot.
  reference_specific_choices:
    - The Workflow Definition is a Markdown file with a YAML front matter section.
    - The work source adapters target specific hosted trackers.
    - The agent runtime is Codex in app-server mode over JSON-RPC on standard streams.
    - Remote execution uses SSH, and the workspace root is interpreted on the remote host.
    - Runtime state is held in memory, so a restart clears blocked entries.
    - Concrete defaults such as the poll interval and the stall timeout.
    - The retry delay doubles from a fixed base until it reaches the configured ceiling.
    - The observability service is a Phoenix application with a live view and a JSON API.
    - Startup requires an explicit acknowledgement flag before the agent is run unattended.

areas:
  - name: Persistence mechanism
    freedom: Any persistence approach may be used.
    fixed_semantics:
      - Authoritative state remains unambiguous.
    document:
      - The selected persistence approach and the durability guarantees it provides.

  - name: Execution topology
    freedom: Responsibilities may be implemented in one or multiple execution units.
    fixed_semantics:
      - Responsibility ownership remains semantically unambiguous.

# Rationale has no record type and no section of its own. Write it at the grain
# of what it justifies, in the slot that already exists for that grain:
#
#   whole subject  -> the prose below, as a stated boundary of the subject
#   one chapter    -> that chapter's `overview:` in chapters.yaml
#   one record     -> `intent:` on the invariant, or a sentence in the record
#
# A separate design-intent list ends up as a collection nothing points at, and
# it pre-announces the invariants that state the same facts one section later.

context: >
  Describe the environment, assumptions, and forces needed to understand the subject.

problem: >
  Describe the problem independently of the current implementation.

why_specification_exists: >
  Explain which design knowledge, guarantees, or boundaries would otherwise be
  lost, misunderstood, or coupled to a particular implementation. State the
  boundaries the subject holds to across all of its behavior here, where a
  reader meets them before anything rests on them.

goals:
  - Preserve the subject's intended semantics independently of implementation mechanism.
  - Make enough of the whole system explicit that another implementation can be built.

non_goals:
  - Prescribe internal structure unless that structure is itself part of the contract.

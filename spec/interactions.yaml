interactions:
  - id: interaction.process-request
    name: Process Request
    purpose: >
      Describe the end-to-end interaction that turns an accepted Request into a Result.
    participants:
      - concept.request
      - responsibility.processing
      - concept.result
    owner: responsibility.processing
    trigger: A Request is accepted for processing.
    preconditions:
      - The Request satisfies all required validity conditions.
    sequence:
      - actor: responsibility.processing
        action: Determine whether the Request can be processed under the current state and policy.
      - actor: responsibility.processing
        action: Perform the required semantic operation.
      - actor: responsibility.processing
        action: Expose the resulting outcome.
    postconditions:
      - The outcome is observable as either a Result or a defined failure.
    invariants:
      - invariant.outcome-is-unambiguous
    failures:
      - failure.processing-interrupted
    # Any rendered list may name itself with `<field>_label`. Name what the list
    # holds, not which slot of the record type it came from: a document whose
    # labels are all type defaults has labels that carry no information.
    requirements_label: Outcome requirements
    requirements:
      - level: must_not
        statement: Complete with an ambiguous externally observable outcome.
    verification:
      - Submit a valid Request and verify exactly one unambiguous outcome (a Result or a defined failure) becomes observable.
